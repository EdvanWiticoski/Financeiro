    // RFC 5545 RRULE Parser Universal com suporte a COUNT e Parcelamento
    const projectRRuleOccurrences = (pattern, startDateStr, endDateStr) => {
      const occurrences = [];
      if (!pattern || pattern.active === false) return occurrences;

      const parts = {};
      (pattern.rrule || '').replace(/^RRULE:/i, '').split(';').forEach(p => {
        const [k, v] = p.split('=');
        if (k && v) parts[k.trim().toUpperCase()] = v.trim();
      });

      const freq = parts.FREQ || 'MONTHLY';
      const interval = parseInt(parts.INTERVAL || '1', 10);
      const byMonthDay = parts.BYMONTHDAY ? parseInt(parts.BYMONTHDAY, 10) : null;
      const count = parts.COUNT ? parseInt(parts.COUNT, 10) : null;

      // Data de início do padrão
      const pStartParts = (pattern.start_date || startDateStr).split('-').map(Number);
      const pStartYear = pStartParts[0];
      const pStartMonth = pStartParts[1] - 1;
      const pStartDay = byMonthDay || pStartParts[2] || 1;

      // Janela do mês selecionado
      const [sY, sM, sD] = startDateStr.split('-').map(Number);
      const [eY, eM, eD] = endDateStr.split('-').map(Number);

      const startLimit = new Date(sY, sM - 1, sD, 0, 0, 0);
      const endLimit = new Date(eY, eM - 1, eD, 23, 59, 59);
      const pStart = new Date(pStartYear, pStartMonth, pStartDay, 0, 0, 0);

      let pEnd = null;
      if (pattern.end_date) {
        const [endY, endM, endD] = pattern.end_date.split('-').map(Number);
        pEnd = new Date(endY, endM - 1, endD, 23, 59, 59);
      }

      let cur = new Date(pStartYear, pStartMonth, pStartDay, 12, 0, 0);
      let iteration = 0;

      while (cur <= endLimit) {
        iteration++;
        if (count && iteration > count) break;
        if (pEnd && cur > pEnd) break;

        if (cur >= startLimit && cur >= pStart) {
          const yr = cur.getFullYear();
          const mo = String(cur.getMonth() + 1).padStart(2, '0');
          const da = String(cur.getDate()).padStart(2, '0');
          const dateStr = `${yr}-${mo}-${da}`;

          occurrences.push({
            id: `proj-${pattern.id}-${dateStr}`,
            pattern_id: pattern.id,
            date: dateStr,
            description: count ? `${pattern.description} (${iteration}/${count})` : pattern.description,
            installment: count ? `${iteration}/${count}` : null,
            titular: pattern.titular,
            ownership_type: pattern.ownership_type || 'owner_only',
            template_postings: pattern.template_postings,
            is_virtual: true
          });
        }

        if (freq === 'MONTHLY') {
          cur = new Date(cur.getFullYear(), cur.getMonth() + interval, pStartDay, 12, 0, 0);
        } else if (freq === 'WEEKLY') {
          cur = new Date(cur.getTime() + interval * 7 * 86400000);
        } else if (freq === 'YEARLY') {
          cur = new Date(cur.getFullYear() + interval, cur.getMonth(), pStartDay, 12, 0, 0);
        } else {
          break;
        }
      }

      return occurrences;
    };

    // Projeção Completa de Todos os Meses de uma Recorrência (Para Linha do Tempo / Cronograma Mês a Mês)
    const projectAllRecurrenceMonths = (pattern, maxMonths = 36) => {
      if (!pattern) return [];
      const parts = {};
      (pattern.rrule || '').replace(/^RRULE:/i, '').split(';').forEach(p => {
        const [k, v] = p.split('=');
        if (k && v) parts[k.trim().toUpperCase()] = v.trim();
      });

      const freq = parts.FREQ || 'MONTHLY';
      const interval = parseInt(parts.INTERVAL || '1', 10);
      const count = parts.COUNT ? parseInt(parts.COUNT, 10) : null;
      const dayOfMonth = parseInt(parts.BYMONTHDAY || '10', 10);

      const [pStartYear, pStartMonth, pStartDay] = (pattern.start_date || '2026-01-01').split('-').map(Number);
      const targetCount = count || maxMonths;

      let pEnd = null;
      if (pattern.end_date) {
        const [endY, endM, endD] = pattern.end_date.split('-').map(Number);
        pEnd = new Date(endY, endM - 1, endD, 23, 59, 59);
      }

      const occurrences = [];
      let cur = new Date(pStartYear, pStartMonth - 1, dayOfMonth || pStartDay, 12, 0, 0);
      let iteration = 0;

      while (iteration < targetCount) {
        iteration++;
        if (pEnd && cur > pEnd) break;

        const yr = cur.getFullYear();
        const mo = String(cur.getMonth() + 1).padStart(2, '0');
        const da = String(cur.getDate()).padStart(2, '0');
        const dateStr = `${yr}-${mo}-${da}`;

        occurrences.push({
          index: iteration,
          totalCount: count,
          date: dateStr,
          year: yr,
          month: cur.getMonth() + 1,
          ymStr: `${yr}-${mo}`,
          installment: count ? `${iteration}/${count}` : `#${iteration}`,
          description: pattern.description
        });

        if (freq === 'MONTHLY') {
          cur = new Date(cur.getFullYear(), cur.getMonth() + interval, dayOfMonth || pStartDay, 12, 0, 0);
        } else if (freq === 'WEEKLY') {
          cur = new Date(cur.getTime() + interval * 7 * 86400000);

            supabase.from('familias').select('*')

          const userMemberships = membRes.data || [];
          const userFamilies = famRes.data || [];

          // Seleciona a família ativa priorizando "Família Edvan & Yasmin" se existir

                         userFamilies[0] || null;

          let activeFamId = activeFam?.id || userMemberships[0]?.familia_id || null;

                  familia_id: newFam.id,

          // 3. Atualiza estado de Família Ativa e Membros da Família

          if (activeFamId) {

              .from('membros_familia')
              .select('*')
              .eq('familia_id', activeFamId);

            const memberList = allMembers || userMemberships;
            setMembrosFamilia(memberList);
            const outroMembro = memberList.find(m => m.user_id !== currentUserId);
            if (outroMembro?.nome_exibicao) {

          } else {
            setMembrosFamilia([]);
            setPartnerName('');
          }

          // 4. Carrega os dados financeiros da família ativa
          if (activeFamId) {
            const isEdvanFamily = activeFamId === 'df2aeb45-8822-47fe-8b71-dfb3c4ff1399' || 
                                  (activeFam?.nome && activeFam.nome.toLowerCase().includes('edvan')) ||
                                  (user?.email && user.email.includes('edvan'));
            
            let accQuery = supabase.from('accounts').select('*');
            let transQuery = supabase.from('transactions').select('*');
            let budgQuery = supabase.from('budgets').select('*');
            let recQuery = supabase.from('recurring_patterns').select('*');
            let valQuery = supabase.from('investment_valuations').select('*');

            if (isEdvanFamily) {

              transQuery = transQuery.or(`familia_id.eq.${activeFamId},familia_id.is.null`);
              budgQuery = budgQuery.or(`familia_id.eq.${activeFamId},familia_id.is.null`);
              recQuery = recQuery.or(`familia_id.eq.${activeFamId},familia_id.is.null`);
              valQuery = valQuery.or(`familia_id.eq.${activeFamId},familia_id.is.null`);
            } else {
              accQuery = accQuery.eq('familia_id', activeFamId);
              transQuery = transQuery.eq('familia_id', activeFamId);
              budgQuery = budgQuery.eq('familia_id', activeFamId);
              recQuery = recQuery.eq('familia_id', activeFamId);
              valQuery = valQuery.eq('familia_id', activeFamId);

            const [accRes, transRes, budgRes, recRes, setRes, valRes, usrRes] = await Promise.all([

            const loadedVal = valRes.data || [];

            setAccounts(loadedAccounts);

              if (setRes.data.partner_name && partnerName) setPartnerName(setRes.data.partner_name);
              if (setRes.data.onboarding_completed !== undefined && setRes.data.onboarding_completed !== null) {

              .eq('id', cleanCode)

            p_codigo_convite: cleanCode.toUpperCase(),

          showToast(data?.message || "Você entrou na família com sucesso! 🏠");

          console.error("Erro ao aceitar convite:", err);
          setModalConvite(prev => ({ ...prev, loading: false }));
          triggerHaptic('error');
          showToast(`Erro ao entrar na família: ${err.message}`);

      const handleLogin = async (email, password) => {
        if (!email || !password) {
          showToast("Informe o e-mail e a senha.");
          return;
        }
        if (loginAttempts >= 5 && Date.now() < lockUntil) {
          const restante = Math.ceil((lockUntil - Date.now()) / 1000);
          showToast(`Muitas tentativas incorretas. Aguarde ${restante}s.`);
          return;
        }

        setAuthLoading(true);

        if (!supabase) {
          // Modo local/demonstração
          setTimeout(() => {
            setAuthLoading(false);
            const isAdm = email.toLowerCase().includes('admin');
            if (isAdm) {
              setMfaRequired(true);
              setTempAuthUser({ email, nome: 'Super Admin', is_super_admin: true });
              showToast("🔐 Autenticação Multifator (MFA) exigida para Super Admin.");
            } else {
              setIsAuthenticated(true);
              if (email.toLowerCase().includes('yasmin')) {
                setOwnerName('Yasmin');
              } else {
                setOwnerName('Edvan');
              }
              showToast("Login realizado com sucesso! 👋");
            }
          }, 300);
          return;
        }

        try {
          const { data: authData, error: authError } = await supabase.auth.signInWithPassword({
            email: email.trim(),
            password: password
          });

          if (authError) throw authError;

          const user = authData.user;
          if (user && !user.email_confirmed_at && user.confirmed_at === null) {
            showToast("Por favor, confirme seu e-mail antes de acessar o aplicativo.");
            await supabase.auth.signOut();
            setAuthLoading(false);
            return;
          }

          // Checa se o usuário autenticado possui privilégio de Super Admin
          let isSuperAdminUser = false;
          try {
            const { data: isSuperAdminResp } = await supabase.rpc('is_super_admin');
            if (isSuperAdminResp === true) isSuperAdminUser = true;
          } catch (e) {
            console.warn("RPC is_super_admin check:", e);
          }

          if (isSuperAdminUser || (user?.email && user.email.toLowerCase().startsWith('admin@'))) {
            setMfaRequired(true);
            setTempAuthUser(user);
            setAuthLoading(false);
            showToast("🔐 Autenticação Multifator (MFA) exigida para Super Admin.");
            return;
          }

          setLoginAttempts(0);
          setIsAuthenticated(true);
          
          if (user) {
            try {
              await supabase.from('usuarios').upsert({
                id: user.id,
                email: user.email,
                nome: user.user_metadata?.full_name || (user.email.includes('edvan') ? 'Edvan' : (user.email.includes('yasmin') ? 'Yasmin' : 'Usuário')),
                updated_at: new Date().toISOString()
              }, { onConflict: 'id' });

          }

          showToast("Login realizado com sucesso! 👋");

          console.error("Erro no login:", err);
          const novasTentativas = loginAttempts + 1;
          setLoginAttempts(novasTentativas);
          if (novasTentativas >= 5) {
            setLockUntil(Date.now() + 60000);
          }
          
          let msg = err.message || 'Credenciais inválidas';
          if (msg.includes('Email not confirmed')) {
            msg = '📧 Seu e-mail ainda não foi confirmado. Verifique sua caixa de entrada.';
          } else if (msg.includes('Invalid login credentials')) {

        try {
          const { data, error } = await supabase.auth.signUp({
            email: email.trim(),

              data: { full_name: nome.trim() }
            }
          });

            showToast("⚠️ Este e-mail já está cadastrado no sistema. Faça login diretamente ou recupere sua senha.");

          if (data.user && !data.session) {

            if (data.user) {

                  id: data.user.id,
                  email: data.user.email,
                  nome: nome.trim(),
                  updated_at: new Date().toISOString()
                }, { onConflict: 'id' });
              } catch (e) {
                console.warn("Sync perfil no cadastro:", e);

            }
            setIsAuthenticated(true);
            setOwnerName(nome.trim());
            showToast("Conta criada e autenticada com sucesso! 🎉");

        } catch (err) {
          console.error("Erro no cadastro:", err);

            msg = 'Este e-mail já possui cadastro. Acesse a aba Entrar.';
          } else if (msg.includes('rate limit') || msg.includes('rate_limit')) {
            msg = 'Limite de envio de e-mails do Supabase atingido. Desmarque "Confirm email" no painel do Supabase para cadastro e login instantâneos.';
          }
          showToast(`Atenção: ${msg}`);

          setAuthLoading(false);

      const handleVerifyMfa = async (code) => {

        setMfaLoading(true);
        setTimeout(async () => {

      const handleUploadAvatar = async (file) => {
        if (!file) return;

        if (!file.type.startsWith('image/')) {
          showToast("Selecione um arquivo de imagem válido (JPG, PNG, WebP).");
          return;
        }
        if (file.size > 5 * 1024 * 1024) {
          showToast("A imagem deve ter no máximo 5MB.");
          return;
        }

        if (!supabase) {
          const localUrl = URL.createObjectURL(file);
          const upd = { ...userProfile, avatar_url: localUrl };
          setUserProfile(upd);
          localStorage.setItem('fin_user_profile', JSON.stringify(upd));
          showToast("Foto de perfil atualizada localmente!");
          return;
        }

        setUploadingAvatar(true);
        try {
          const { data: { user } } = await supabase.auth.getUser();
          if (!user) throw new Error("Usuário não autenticado");

          const fileExt = file.name.split('.').pop();
          const cleanExt = fileExt ? fileExt.toLowerCase().replace(/[^a-z0-9]/g, '') : 'jpg';
          const filePath = `${user.id}/${Date.now()}.${cleanExt}`;

          // Upload com RLS: salvo dentro da pasta do usuário (auth.uid())
          const { error: uploadError } = await supabase.storage
            .from('avatars')
            .upload(filePath, file, { upsert: true, cacheControl: '3600' });

          if (uploadError) throw uploadError;

          // Obter URL pública oficial do Supabase Storage
          const { data: { publicUrl } } = supabase.storage
            .from('avatars')
            .getPublicUrl(filePath);

          const updatedProfile = { ...userProfile, avatar_url: publicUrl };
          setUserProfile(updatedProfile);
          localStorage.setItem('fin_user_profile', JSON.stringify(updatedProfile));

          await supabase.from('usuarios').upsert({
            id: user.id,
            avatar_url: publicUrl,
            updated_at: new Date().toISOString()
          });

          triggerHaptic('success');
          showToast("Foto de perfil enviada com sucesso! 📷");
        } catch (err) {
          console.error("Erro no upload do avatar:", err);
          triggerHaptic('error');
          showToast(`Erro no upload da foto: ${err.message || 'Falha ao enviar imagem'}`);
        } finally {
          setUploadingAvatar(false);
        }
      };

      const handleSalvarPerfil = async (novoPerfil) => {
        setProfileSaving(true);

          const emailFinal = (novoPerfil.email || '').trim();

          // 1. Atualização oficial de E-mail via supabase.auth.updateUser()
          if (emailFinal && user?.email && emailFinal.toLowerCase() !== user.email.toLowerCase()) {
            const { error: emailError } = await supabase.auth.updateUser({ email: emailFinal });
            if (emailError) {
              throw new Error(`Falha ao alterar e-mail: ${emailError.message}`);
            } else {
              setEmailChangeNotice(`✉️ Enviamos um link de confirmação para ${emailFinal}. Clique no link recebido para validar a troca.`);

          }

          // 2. Atualização dos dados cadastrais em public.usuarios

              id: currentUserId,

            ...novoPerfil,

          };

          showToast("Perfil atualizado com sucesso! 👤");

          console.error("Erro ao salvar perfil:", err);
          triggerHaptic('error');
          showToast(`Erro ao salvar: ${err.message}`);
        } finally {
          setProfileSaving(false);
        }
      };

      const handleRemoverMembro = async (membroUserId) => {
        if (!familiaAtiva?.id) return;
        if (!confirm("Tem certeza que deseja remover este membro da família?")) return;

        if (!supabase) {
          setMembrosFamilia(prev => prev.filter(m => m.user_id !== membroUserId));

        try {

          showToast(`Erro ao remover membro: ${err.message}`);

      };

      // Diretriz 4: Limpeza Estrita de Segurança (Zero Data Leakage na Memória e Storage)
      const limparMemoriaECacheSeguro = () => {
        // 1. Zera todos os estados na memória RAM do React
        setAuthUser(null);
        setIsAuthenticated(false);
        setIsSuperAdmin(false);
        setMfaRequired(false);
        setAccounts([]);
        setTransactions([]);
        setPostings([]);
        setBudgets([]);
        setRecurringPatterns([]);
        setInvestmentValuations([]);
        setFamilias([]);
        setMembrosFamilia([]);
        setFamiliaAtiva(null);
        setAdminMetrics(null);
        setUserProfile({ nome: '', profissao: '', telefone: '', endereco: '', avatar_url: '' });

        // 2. Itera sobre o localStorage e sessionStorage purgando todos os dados de usuário/família
        try {
          const keysToRemove = [];
          for (let i = 0; i < localStorage.length; i++) {
            const key = localStorage.key(i);
            if (key && (key.startsWith('fin_') || key.startsWith('sb-') || key.includes('supabase'))) {
              keysToRemove.push(key);
            }
          }
          keysToRemove.forEach(k => localStorage.removeItem(k));
          sessionStorage.clear();
        } catch (e) {
          console.warn("Aviso ao limpar storage:", e);
        }

        // 3. Força redirecionamento para login
        setAuthMode('login');
        setActiveTab('dashboard');
      };

      const handleLogout = async () => {
        if (confirm("Deseja realmente sair da sua conta?")) {
          triggerHaptic('medium');
          if (supabase) {
            try {
              await supabase.auth.signOut();
            } catch (err) {
              console.warn("Erro ao fazer logout no Supabase:", err);
            }
          }
          limparMemoriaECacheSeguro();
          showToast("Sessão encerrada com sucesso. Até logo! 👋");
        }
      };

      useEffect(() => {
        // 1. Detecta links de e-mail com erro ou expirados (#error=access_denied ou otp_expired)
        if (window.location.hash && (window.location.hash.includes('error=access_denied') || window.location.hash.includes('otp_expired') || window.location.hash.includes('error_description'))) {
          limparMemoriaECacheSeguro();
          showToast("⚠️ O link de e-mail expirou ou é inválido. Faça login com sua senha ou solicite um novo link.");
          try {
            window.history.replaceState(null, null, window.location.pathname);
          } catch(e) {}
        }
        // 2. Detecta link válido de recuperação de senha (#type=recovery)
        else if (window.location.hash && window.location.hash.includes('type=recovery')) {
          setIsAuthenticated(false);
          setAuthMode('redefinir_senha');
          showToast("🔑 Link de recuperação validado. Crie sua nova senha segura.");
        }

        if (supabase) {
          // Diretriz 1: Inicialização Segura Obrigatória com getUser() no servidor
          const inicializarSessaoSegura = async () => {
            setAuthLoading(true);
            try {
              const { data: { user }, error: userError } = await supabase.auth.getUser();

              if (userError || !user) {
                // Sessão inválida ou adulterada -> Bloqueio estrito e purga de memória
                limparMemoriaECacheSeguro();
              } else {
                setAuthUser(user);
                setIsAuthenticated(true);
                if (user.user_metadata?.full_name) {
                  setOwnerName(user.user_metadata.full_name);
                }

                // Checa privilégio Super Admin
                try {
                  const { data: isAdm } = await supabase.rpc('is_super_admin');
                  setIsSuperAdmin(Boolean(isAdm));
                } catch(e) {
                  setIsSuperAdmin(Boolean(user.app_metadata?.is_super_admin));
                }

                await carregarDados();
              }
            } catch (err) {
              console.error("Erro na inicialização segura com getUser():", err);
              limparMemoriaECacheSeguro();
            } finally {
              setAuthLoading(false);
            }
          };

          inicializarSessaoSegura();

          // Diretriz 2 & 3: Ouvinte Global de Estado (onAuthStateChange) com Renovação Automática Nativa
          const { data: { subscription } } = supabase.auth.onAuthStateChange(async (event, session) => {
            console.log(`[AUTH ENGINE] Evento Supabase: ${event}`);

            if (event === 'SIGNED_IN') {
              if (session?.user) {
                setAuthUser(session.user);
                setIsAuthenticated(true);
                if (session.user.user_metadata?.full_name) {
                  setOwnerName(session.user.user_metadata.full_name);
                }
                await carregarDados();
              }
            } else if (event === 'TOKEN_REFRESHED') {
              // Diretriz 3: Token renovado em segundo plano pela biblioteca nativa do Supabase
              if (session?.user) {
                setAuthUser(session.user);
              }
            } else if (event === 'SIGNED_OUT') {
              // Diretriz 4: Limpeza total de memória e cache no evento SIGNED_OUT
              limparMemoriaECacheSeguro();
            } else if (event === 'PASSWORD_RECOVERY') {
              setIsAuthenticated(false);
              setAuthMode('redefinir_senha');
              showToast("🔑 Link de recuperação validado. Crie sua nova senha segura.");
            }
          });

          return () => {
            subscription?.unsubscribe();
          };
        } else {
          setIsAuthenticated(false);
        }
      }, [supabase]);

      useEffect(() => {
        if (activeTab === 'superadmin') {
          fetchAdminData();
        }
      }, [activeTab, supabase]);

      // Saldos por Conta (Regime de Caixa Realizado - Apenas Lançamentos Liquidados / Efetivados)
      const accountBalances = useMemo(() => {
        const balances = {};
        accounts.forEach(a => { balances[a.id] = 0; });
        
        const completedTransIds = new Set(transactions.filter(t => t.status !== 'pending').map(t => t.id));

        postings.forEach(p => {
          if (!completedTransIds.has(p.transaction_id)) return;
          const acc = accounts.find(a => a.id === p.account_id);
          if (acc) {
            const amt = Number(p.amount) || 0;
            if (acc.account_type === 'ASSET' || acc.account_type === 'EXPENSE') {
              balances[acc.id] = (balances[acc.id] || 0) + amt;
            } else {
              balances[acc.id] = (balances[acc.id] || 0) - amt;
            }
          }
        });
        return balances;
      }, [accounts, postings, transactions]);

      // Saldos Previstos (Com Lançamentos Pendentes)
      const predictedBalances = useMemo(() => {
        const balances = {};
        accounts.forEach(a => { balances[a.id] = 0; });
        postings.forEach(p => {
          const acc = accounts.find(a => a.id === p.account_id);
          if (acc) {
            const amt = Number(p.amount) || 0;
            if (acc.account_type === 'ASSET' || acc.account_type === 'EXPENSE') {
              balances[acc.id] = (balances[acc.id] || 0) + amt;
            } else {
              balances[acc.id] = (balances[acc.id] || 0) - amt;
            }
          }
        });
        return balances;
      }, [accounts, postings]);

      const activeAccounts = useMemo(() => accounts.filter(a => a.is_active !== false), [accounts]);
      const totalAtivos = useMemo(() => accounts.filter(a => a.account_type === 'ASSET' && a.is_active !== false).reduce((s, a) => s + (accountBalances[a.id] || 0), 0), [accounts, accountBalances]);
      const totalPassivos = useMemo(() => accounts.filter(a => a.account_type === 'LIABILITY' && a.is_active !== false).reduce((s, a) => s + (accountBalances[a.id] || 0), 0), [accounts, accountBalances]);
      const patrimonioLiquido = totalAtivos - totalPassivos;

      const totalAtivosPrevistos = useMemo(() => accounts.filter(a => a.account_type === 'ASSET' && a.is_active !== false).reduce((s, a) => s + (predictedBalances[a.id] || 0), 0), [accounts, predictedBalances]);
      const totalPassivosPrevistos = useMemo(() => accounts.filter(a => a.account_type === 'LIABILITY' && a.is_active !== false).reduce((s, a) => s + (predictedBalances[a.id] || 0), 0), [accounts, predictedBalances]);
      const patrimonioLiquidoPrevisto = totalAtivosPrevistos - totalPassivosPrevistos;

      // CRUD DE CONTAS & CATEGORIAS
      const salvarConta = async (contaData) => {
        const isEdit = Boolean(contaData.id);
        const id = isEdit ? contaData.id : generateUUID();
        
        const obj = {
          id,
          name: contaData.name.trim(),
          account_type: contaData.account_type,
          subtype: contaData.subtype || 'general',
          titular: contaData.titular || 'Ambos',
          color: contaData.color || '#4f46e5',
          is_active: contaData.is_active !== false,
          created_at: contaData.created_at || new Date().toISOString()
        };

        const upd = isEdit ? accounts.map(a => a.id === id ? { ...a, ...obj } : a) : [...accounts, obj];
        setAccounts(upd);
        setOnboardingCompleted(true);
        localStorage.setItem('fin_onboarding_completed', 'true');

        if (!supabase) {
          localStorage.setItem('fin_acc_v3', JSON.stringify(upd));
        } else {
          try {
            await supabase.from('accounts').upsert(obj);
            await supabase.from('user_settings').upsert({
              owner_name: ownerName,
              partner_name: partnerName,
              onboarding_completed: true,
              onboarding_decision: 'custom',
              updated_at: new Date().toISOString()
            });
            await carregarDados();
          } catch (err) {
            console.error("Erro ao salvar conta no Supabase:", err);
          }
        }

        triggerHaptic('success');
        showToast(isEdit ? `Categoria "${obj.name}" atualizada!` : `Categoria "${obj.name}" criada com sucesso!`);
        setModalConta({ show: false, mode: 'create', account: null });
      };

      const inativarConta = async (acc) => {
        const upd = accounts.map(a => a.id === acc.id ? { ...a, is_active: false } : a);
        setAccounts(upd);

        if (!supabase) {
          localStorage.setItem('fin_acc_v3', JSON.stringify(upd));
        } else {
          await supabase.from('accounts').update({ is_active: false }).eq('id', acc.id);
          await carregarDados();
        }

        triggerHaptic('warning');
        showToast(`Categoria "${acc.name}" inativada com sucesso!`, () => reativarConta(acc));
        setSoftDeleteModal({ show: false, account: null, postingCount: 0 });
      };

      const reativarConta = async (acc) => {
        const upd = accounts.map(a => a.id === acc.id ? { ...a, is_active: true } : a);
        setAccounts(upd);

        if (!supabase) {
          localStorage.setItem('fin_acc_v3', JSON.stringify(upd));
        } else {
          await supabase.from('accounts').update({ is_active: true }).eq('id', acc.id);
          await carregarDados();
        }

        triggerHaptic('success');
        showToast(`Categoria "${acc.name}" reativada com sucesso!`);
      };

      const solicitarExclusaoConta = (acc) => {
        triggerHaptic('warning');
        const count = postings.filter(p => p.account_id === acc.id).length;
        if (count > 0) {
          setSoftDeleteModal({ show: true, account: acc, postingCount: count });
        } else {
          setDeleteModal({ show: true, type: 'account', id: acc.id, title: acc.name });
        }
      };

      const confirmarExclusaoFisica = async () => {
        if (deleteModal.type === 'account') {
          const accId = deleteModal.id;
          const old = [...accounts];
          const upd = accounts.filter(a => a.id !== accId);
          setAccounts(upd);

          if (!supabase) {
            localStorage.setItem('fin_acc_v3', JSON.stringify(upd));
          } else {
            await supabase.from('accounts').delete().eq('id', accId);
            await carregarDados();
          }

          triggerHaptic('warning');
          showToast(`Categoria "${deleteModal.title}" excluída.`, () => {
            setAccounts(old);
            if (!supabase) localStorage.setItem('fin_acc_v3', JSON.stringify(old));
            else supabase.from('accounts').insert(old.find(a => a.id === accId));
          });
        } else if (deleteModal.type === 'transaction') {
          const transId = deleteModal.id;
          const oldTrans = [...transactions];
          const oldPost = [...postings];
          const updTrans = transactions.filter(t => t.id !== transId);
          const updPost = postings.filter(p => p.transaction_id !== transId);
          setTransactions(updTrans);
          setPostings(updPost);

          if (!supabase) {
            localStorage.setItem('fin_trans_v3', JSON.stringify(updTrans));
            localStorage.setItem('fin_post_v3', JSON.stringify(updPost));
          } else {
            await supabase.from('transactions').delete().eq('id', transId);
            await carregarDados();
          }

          triggerHaptic('warning');
          showToast(`Lançamento excluído.`, () => {
            setTransactions(oldTrans);
            setPostings(oldPost);
            if (!supabase) {
              localStorage.setItem('fin_trans_v3', JSON.stringify(oldTrans));
              localStorage.setItem('fin_post_v3', JSON.stringify(oldPost));
            }
          });
        }

        setDeleteModal({ show: false, type: '', id: null, title: '' });
      };

      // Helper Inteligente: Obtém o orçamento de uma conta (Específico do Mês ou Padrão para Todos os Meses)
      const getBudgetForAccount = (accId, year, month) => {
        // 1. Busca orçamento específico para o ano e mês
        const specific = budgets.find(b => b.account_id === accId && b.year === year && b.month === month);
        if (specific && specific.budgeted_amount !== undefined && !isNaN(Number(specific.budgeted_amount))) {
          return Number(specific.budgeted_amount);
        }

        // 2. Busca o orçamento padrão geral da conta para o ano
        const yearDefault = budgets.find(b => b.account_id === accId && b.year === year && b.is_all_months);
        if (yearDefault && yearDefault.budgeted_amount !== undefined && !isNaN(Number(yearDefault.budgeted_amount))) {
          return Number(yearDefault.budgeted_amount);
        }

        // 3. Fallback: orçamento mais recente cadastrado para a conta
        const anyBudget = budgets.filter(b => b.account_id === accId).sort((a, b) => (b.created_at || '').localeCompare(a.created_at || ''))[0];
        return anyBudget && anyBudget.budgeted_amount !== undefined ? Number(anyBudget.budgeted_amount) : 0;
      };

      // Helper: Verifica se a conta possui um orçamento personalizado exclusivamente para este mês
      const isBudgetCustom = (accId, year, month) => {
        const specific = budgets.find(b => b.account_id === accId && b.year === year && b.month === month);
        return Boolean(specific && specific.is_custom_month);
      };

      // Salva o orçamento (Aplicando para Todos os Meses ou Apenas no Mês Selecionado)
      const salvarOrcamento = async (accountId, amount, applyToAllMonths = true) => {
        const val = Math.max(0, parseFloat(amount) || 0);
        const acc = accounts.find(a => a.id === accountId);
        const accName = acc ? acc.name : 'Categoria';

        if (applyToAllMonths) {
          // Define para todos os 12 meses do ano selecionado como meta contínua
          const newBudgets = [];
          for (let m = 1; m <= 12; m++) {
            const existing = budgets.find(b => b.account_id === accountId && b.year === selectedYear && b.month === m);
            newBudgets.push({
              id: existing?.id || generateUUID(),
              account_id: accountId,
              year: selectedYear,
              month: m,
              budgeted_amount: val,
              titular: 'Ambos',
              is_all_months: true,
              is_custom_month: false,
              created_at: new Date().toISOString()
            });
          }

          const upd = budgets.filter(b => !(b.account_id === accountId && b.year === selectedYear)).concat(newBudgets);
          setBudgets(upd);
          localStorage.setItem('fin_budg_v3', JSON.stringify(upd));

          if (supabase) {
            try {
              await supabase.from('budgets').upsert(newBudgets, { onConflict: 'account_id,month,year' });
            } catch (err) {
              console.error("Erro ao salvar orçamento em todos os meses no Supabase:", err);
            }
          }
          triggerHaptic('success');
          showToast(`Meta de "${accName}" (${formatarMoeda(val)}) definida para TODOS os meses de ${selectedYear}!`);
        } else {
          // Altera apenas o mês selecionado
          const existing = budgets.find(b => b.account_id === accountId && b.year === selectedYear && b.month === selectedMonth);
          const budgetObj = {
            id: existing?.id || generateUUID(),
            account_id: accountId,
            year: selectedYear,
            month: selectedMonth,
            budgeted_amount: val,
            titular: 'Ambos',
            is_all_months: false,
            is_custom_month: true,
            created_at: new Date().toISOString()
          };

          const upd = budgets.filter(b => !(b.account_id === accountId && b.year === selectedYear && b.month === selectedMonth)).concat([budgetObj]);
          setBudgets(upd);
          localStorage.setItem('fin_budg_v3', JSON.stringify(upd));

          if (supabase) {
            try {
              await supabase.from('budgets').upsert(budgetObj, { onConflict: 'account_id,month,year' });
            } catch (err) {
              console.error("Erro ao salvar orçamento mensal no Supabase:", err);
            }
          }
          triggerHaptic('success');
          showToast(`Meta de "${accName}" ajustada especificamente para ${monthsFullNames[selectedMonth - 1]} (${formatarMoeda(val)})!`);
        }
      };

      // ZBB & Resumo Mensal
      const zbbSummary = useMemo(() => {
        const ymStr = `${selectedYear}-${String(selectedMonth).padStart(2, '0')}`;
        const transDoMes = transactions.filter(t => t.date && t.date.startsWith(ymStr));
        const transMap = new Map(transDoMes.map(t => [t.id, t]));
        const postingsDoMes = postings.filter(p => transMap.has(p.transaction_id));

        const getZbbWeight = (t) => {
          if (!t) return 1.0;
          if (filtroTitularZbb === 'ambos') return 1.0;
          const isEd = isOwnerInvest(t, null);
          const isYas = isPartnerInvest(t, null);
          const own = t.ownership_type;
          const tit = (t.titular || '').toLowerCase();

          if (filtroTitularZbb === 'owner') {
            if (isEd && !isYas) return 1.0;
            if (isYas && !isEd) return 0.0;
            if (tit === 'edvan' || tit === (ownerName || 'edvan').toLowerCase()) return 1.0;
            if (tit === 'yasmin' || tit === (partnerName || 'yasmin').toLowerCase()) return 0.0;
            if (own === 'owner_only') return 1.0;
            if (own === 'partner_only') return 0.0;
            if (own === 'shared_50_50' || t.titular === 'Ambos') return 0.5;
            return 1.0;
          }

          if (filtroTitularZbb === 'partner') {
            if (isYas && !isEd) return 1.0;
            if (isEd && !isYas) return 0.0;
            if (tit === 'yasmin' || tit === (partnerName || 'yasmin').toLowerCase()) return 1.0;
            if (tit === 'edvan' || tit === (ownerName || 'edvan').toLowerCase()) return 0.0;
            if (own === 'partner_only') return 1.0;
            if (own === 'owner_only') return 0.0;
            if (own === 'shared_50_50' || t.titular === 'Ambos') return 0.5;
            return 0.0;
          }

          return 1.0;
        };

        const getZbbAccWeight = (a) => {
          if (!a) return 1.0;
          if (filtroTitularZbb === 'ambos') return 1.0;
          const isEd = isOwnerInvest(null, a);
          const isYas = isPartnerInvest(null, a);
          const tit = (a.titular || '').toLowerCase();

          if (filtroTitularZbb === 'owner') {
            if (isEd && !isYas) return 1.0;
            if (isYas && !isEd) return 0.0;
            if (tit === 'edvan' || tit === (ownerName || 'edvan').toLowerCase()) return 1.0;
            if (tit === 'yasmin' || tit === (partnerName || 'yasmin').toLowerCase()) return 0.0;
            if (tit === 'ambos') return 0.5;
            return 1.0;
          }

          if (filtroTitularZbb === 'partner') {
            if (isYas && !isEd) return 1.0;
            if (isEd && !isYas) return 0.0;
            if (tit === 'yasmin' || tit === (partnerName || 'yasmin').toLowerCase()) return 1.0;
            if (tit === 'edvan' || tit === (ownerName || 'edvan').toLowerCase()) return 0.0;
            if (tit === 'ambos') return 0.5;
            return 0.0;
          }

          return 1.0;
        };

        let rendaTotal = 0;
        let rendaRecebida = 0;
        let rendaPendente = 0;

        let despesaTotal = 0;
        let despesaPaga = 0;
        let despesaPendente = 0;

        const gastosPorConta = {};
        const receitasPorConta = {};

        postingsDoMes.forEach(p => {
          const trans = transMap.get(p.transaction_id);
          const isPending = trans?.status === 'pending';
          const acc = accounts.find(a => a.id === p.account_id);
          const tw = getZbbWeight(trans);
          if (tw === 0) return;

          if (acc) {
            if (acc.account_type === 'REVENUE') {
              const val = Math.abs(Number(p.amount) || 0) * tw;
              rendaTotal += val;
              if (isPending) rendaPendente += val;
              else rendaRecebida += val;
              receitasPorConta[acc.id] = (receitasPorConta[acc.id] || 0) + val;
            }
            if (acc.account_type === 'EXPENSE') {
              const val = Math.abs(Number(p.amount) || 0) * tw;
              despesaTotal += val;
              if (isPending) despesaPendente += val;
              else despesaPaga += val;
              gastosPorConta[acc.id] = (gastosPorConta[acc.id] || 0) + val;
            }
          }
        });

        // 1. Envelopes de Despesas
        const envelopes = activeAccounts
          .filter(a => a.account_type === 'EXPENSE')
          .map(acc => {
            const accW = getZbbAccWeight(acc);
            if (accW === 0) return null;

            const baseBudget = getBudgetForAccount(acc.id, selectedYear, selectedMonth);
            const budgeted = baseBudget * accW;
            const isCustom = isBudgetCustom(acc.id, selectedYear, selectedMonth);
            const spent = Number(gastosPorConta[acc.id]) || 0;
            const available = budgeted - spent;
            const pct = budgeted > 0 ? Math.round((spent / budgeted) * 100) : (spent > 0 ? 100 : 0);
            return { account: acc, baseBudget, budgeted, isCustom, spent, available, pct, accWeight: accW };
          })
          .filter(Boolean);

        // 2. Metas de Receita Estimada vs. Realizada
        const metasReceita = activeAccounts
          .filter(a => a.account_type === 'REVENUE')
          .map(acc => {
            const accW = getZbbAccWeight(acc);
            if (accW === 0) return null;

            const baseBudget = getBudgetForAccount(acc.id, selectedYear, selectedMonth);
            const estimated = baseBudget * accW;
            const isCustom = isBudgetCustom(acc.id, selectedYear, selectedMonth);
            const realized = Number(receitasPorConta[acc.id]) || 0;
            const superavit = realized - estimated;
            const pct = estimated > 0 ? Number(((realized / estimated) * 100).toFixed(1)) : (realized > 0 ? 100 : 0);
            return { account: acc, baseBudget, estimated, isCustom, realized, superavit, pct, accWeight: accW };
          })
          .filter(Boolean);

        const totalReceitaEstimada = metasReceita.reduce((sum, m) => sum + m.estimated, 0);
        const totalReceitaRealizada = metasReceita.reduce((sum, m) => sum + m.realized, 0);
        const superavitTotalReceita = totalReceitaRealizada - totalReceitaEstimada;

        const totalOrcado = envelopes.reduce((sum, e) => sum + e.budgeted, 0);
        const aSerOrcado = rendaRecebida - totalOrcado;

        return {
          rendaTotal,
          rendaRecebida,
          rendaPendente,
          despesaTotal,
          despesaPaga,
          despesaPendente,
          totalOrcado,
          aSerOrcado,
          envelopes,
          metasReceita,
          totalReceitaEstimada,
          totalReceitaRealizada,
          superavitTotalReceita
        };
      }, [accounts, activeAccounts, transactions, postings, budgets, selectedYear, selectedMonth, filtroTitularZbb, ownerName, partnerName]);

      // Envelopes e Metas Filtrados por Status de Orçamento (Todos / Com Orçamento / Sem Orçamento)
      const itensFiltradosZbb = useMemo(() => {
        if (zbbAbaAtiva === 'receitas') {
          return (zbbSummary.metasReceita || []).filter(item => {
            if (filtroZbbStatus === 'com_orcamento') return item.estimated > 0;
            if (filtroZbbStatus === 'sem_orcamento') return item.estimated === 0 || !item.estimated;
            return true;
          });
        }
        return (zbbSummary.envelopes || []).filter(env => {
          if (filtroZbbStatus === 'com_orcamento') return env.budgeted > 0;
          if (filtroZbbStatus === 'sem_orcamento') return env.budgeted === 0 || !env.budgeted;
          return true;
        });
      }, [zbbSummary, zbbAbaAtiva, filtroZbbStatus]);

      const zbbCounters = useMemo(() => {
        const list = zbbAbaAtiva === 'receitas' ? (zbbSummary.metasReceita || []) : (zbbSummary.envelopes || []);
        const total = list.length;
        const comOrcamento = list.filter(e => (zbbAbaAtiva === 'receitas' ? e.estimated : e.budgeted) > 0).length;
        const semOrcamento = total - comOrcamento;
        return { total, comOrcamento, semOrcamento };
      }, [zbbSummary, zbbAbaAtiva]);

      // MÓDULO 11: CÁLCULO DE RATEIO E ACERTO DE CASAL (SPLIT FINANCE - ESTRITAMENTE 50%)
      const acertoDoMes = useMemo(() => {
        const ymStr = `${selectedYear}-${String(selectedMonth).padStart(2, '0')}`;
        
        // 1. Filtrar APENAS despesas que tenham rateio estritamente 50/50 de casal (shared_50_50)
        const transDoMes = transactions.filter(t => {
          if (!t.date || !t.date.startsWith(ymStr)) return false;
          if (t.ownership_type !== 'shared_50_50') return false;

          // Garantir que é estritamente uma DESPESA (EXPENSE) e NUNCA uma Receita
          const transPost = postings.filter(p => p.transaction_id === t.id);
          const isExpense = transPost.some(p => {
            const acc = accounts.find(a => a.id === p.account_id);
            return acc && acc.account_type === 'EXPENSE';
          });
          return isExpense;
        });

        let totalGastoConjunto = 0;
        let dividaParceiro = 0;

        const itens = transDoMes.map(t => {
          const transPost = postings.filter(p => p.transaction_id === t.id);
          const totalVal = transPost.filter(p => p.amount > 0).reduce((s, p) => s + p.amount, 0);
          const debPosting = transPost.find(p => p.amount > 0);
          const catAcc = accounts.find(a => a.id === debPosting?.account_id);

          totalGastoConjunto += totalVal;

          // Estritamente 50%
          const valorDevido = totalVal * 0.5;
          dividaParceiro += valorDevido;

          return {
            transaction: t,
            categoryName: catAcc ? catAcc.name : 'Despesa',
            categoryColor: catAcc ? catAcc.color : '#4f46e5',
            total: totalVal,
            valorDevido,
            ownership_type: t.ownership_type
          };
        });

        const parteTitular = totalGastoConjunto - dividaParceiro;

        return {
          totalGastoConjunto,
          parteTitular,
          dividaParceiro,
          itens
        };
      }, [transactions, postings, accounts, selectedYear, selectedMonth]);

      // Projeções RFC 5545 com Reconciliação Inteligente de Transações Já Realizadas
      const virtualOccurrences = useMemo(() => {
        const ymStr = `${selectedYear}-${String(selectedMonth).padStart(2, '0')}`;
        const startOfMonth = `${ymStr}-01`;
        const lastDay = new Date(selectedYear, selectedMonth, 0).getDate();
        const endOfMonth = `${ymStr}-${String(lastDay).padStart(2, '0')}`;

        const list = [];
        recurringPatterns.filter(r => r.active).forEach(pattern => {
          const occs = projectRRuleOccurrences(pattern, startOfMonth, endOfMonth);
          occs.forEach(occ => {
            const cleanOccDesc = (occ.description || '').replace(/\s*\(\d+\/\d+\)/, '').trim().toLowerCase();
            const cleanPatDesc = (pattern.description || '').replace(/\s*\(\d+\/\d+\)/, '').trim().toLowerCase();

            const jaEfetivado = transactions.some(t => {
              const cleanTDesc = (t.description || '').replace(/\s*\(\d+\/\d+\)/, '').trim().toLowerCase();
              const samePattern = t.recurrence_id && (t.recurrence_id === pattern.id || t.recurrence_id === occ.pattern_id);
              const sameMonth = t.date && t.date.startsWith(ymStr);
              const sameDate = t.date === occ.date || t.recurrence_date === occ.date;
              const sameDesc = cleanTDesc === cleanOccDesc || cleanTDesc === cleanPatDesc;

              // Se a transação tem vínculo com a regra ou mesma descrição no mês, considera já realizado
              return (samePattern && (sameDate || sameMonth)) || (sameDesc && sameMonth);
            });

            if (!jaEfetivado) list.push(occ);
          });
        });
        return list.sort((a, b) => a.date.localeCompare(b.date));
      }, [recurringPatterns, transactions, selectedYear, selectedMonth]);

      // Unificação Completa de Vencimentos e Previsões Pendentes do Mês Selecionado (A Receber + A Pagar)
      const todosVencimentosDoMes = useMemo(() => {
        const ymStr = `${selectedYear}-${String(selectedMonth).padStart(2, '0')}`;
        
        // 1. Lançamentos manuais/avulsos pendentes do mês selecionado
        const pendentesAvulsos = transactions
          .filter(t => t.status === 'pending' && t.date && t.date.startsWith(ymStr))
          .map(t => {
            const transPost = postings.filter(p => p.transaction_id === t.id);
            const hasRevenue = transPost.some(p => {
              const acc = accounts.find(a => a.id === p.account_id);
              return acc?.account_type === 'REVENUE';
            });
            const isReceita = hasRevenue;
            const total = transPost.reduce((max, p) => Math.max(max, Math.abs(Number(p.amount) || 0)), 0) || Math.abs(Number(t.amount) || 0);

            return {
              id: t.id,
              date: t.date,
              description: t.description,
              titular: t.titular || 'Ambos',
              ownership_type: t.ownership_type,
              isReceita,
              total,
              is_virtual: false,
              transaction: t
            };
          });

        // 2. Projeções virtuais de regras recorrentes do mês selecionado
        const recorrentesVirtuais = virtualOccurrences.map(occ => {
          const hasRevenue = occ.template_postings.some(p => {
            const acc = accounts.find(a => a.id === p.account_id);
            return acc?.account_type === 'REVENUE';
          });
          const isReceita = hasRevenue;
          const total = occ.template_postings.reduce((max, p) => Math.max(max, Math.abs(Number(p.amount) || 0)), 0);

          return {
            id: occ.id,
            date: occ.date,
            description: occ.description,
            titular: occ.titular || 'Ambos',
            ownership_type: occ.ownership_type,
            installment: occ.installment,
            isReceita,
            total,
            is_virtual: true,
            occurrence: occ
          };
        });

        // 3. Juntar e ordenar cronologicamente
        return [...pendentesAvulsos, ...recorrentesVirtuais].sort((a, b) => a.date.localeCompare(b.date));
      }, [transactions, postings, accounts, virtualOccurrences, selectedYear, selectedMonth]);

      // Vencimentos e Previsões Filtrados por Tipo (Receber/Pagar) e Titular
      const vencimentosFiltrados = useMemo(() => {
        return todosVencimentosDoMes.filter(item => {
          // Filtro de Tipo (Todos / A Receber / A Pagar)
          if (filtroVencimentosTipo === 'receber' && !item.isReceita) return false;
          if (filtroVencimentosTipo === 'pagar' && item.isReceita) return false;

          // Filtro de Titular
          if (filtroVencimentosTitular === 'owner') {
            if (!isOwnerInvest(item, null)) return false;
          } else if (filtroVencimentosTitular === 'partner') {
            if (!isPartnerInvest(item, null)) return false;
          }

          return true;
        });
      }, [todosVencimentosDoMes, filtroVencimentosTipo, filtroVencimentosTitular, ownerName, partnerName]);

      // Contadores e Somatórios dos Vencimentos & Previsões
      const vencimentosCounters = useMemo(() => {
        let totalReceber = 0, valorReceber = 0;
        let totalPagar = 0, valorPagar = 0;

        todosVencimentosDoMes.forEach(item => {
          if (item.isReceita) {
            totalReceber++;
            valorReceber += item.total;
          } else {
            totalPagar++;
            valorPagar += item.total;
          }
        });

        return {
          total: todosVencimentosDoMes.length,
          totalReceber,
          valorReceber,
          totalPagar,
          valorPagar,
          saldoPrevisto: valorReceber - valorPagar
        };
      }, [todosVencimentosDoMes]);

      // Contadores e Filtros Avançados do Diário Contábil (Respeitando o Mês Selecionado)
      const diarioCounters = useMemo(() => {
        const ymStr = `${selectedYear}-${String(selectedMonth).padStart(2, '0')}`;
        const transBase = transactions.filter(t => filtroPeriodoDiario === 'todos' || (t.date && t.date.startsWith(ymStr)));

        let countEdvan = 0, countYasmin = 0, countAmbos = 0;
        let countRecebido = 0, countPago = 0, countAReceber = 0, countAPagar = 0;

        transBase.forEach(t => {
          if (t.titular === ownerName) countEdvan++;
          else if (t.titular === partnerName) countYasmin++;
          else countAmbos++;

          const transPost = postings.filter(p => p.transaction_id === t.id);
          const debitPosting = transPost.find(p => p.amount > 0);
          const creditPosting = transPost.find(p => p.amount < 0);
          const debitAcc = debitPosting ? accounts.find(a => a.id === debitPosting.account_id) : null;
          const creditAcc = creditPosting ? accounts.find(a => a.id === creditPosting.account_id) : null;
          const isReceita = (creditAcc && creditAcc.account_type === 'REVENUE') || (debitAcc && debitAcc.account_type === 'REVENUE');
          const isPending = t.status === 'pending';

          if (isReceita && !isPending) countRecebido++;
          else if (!isReceita && !isPending) countPago++;
          else if (isReceita && isPending) countAReceber++;
          else if (!isReceita && isPending) countAPagar++;
        });

        return {
          total: transBase.length,
          countEdvan,
          countYasmin,
          countAmbos,
          countRecebido,
          countPago,
          countAReceber,
          countAPagar
        };
      }, [transactions, postings, accounts, ownerName, partnerName, selectedYear, selectedMonth, filtroPeriodoDiario]);

      const transFiltradasDiario = useMemo(() => {
        const ymStr = `${selectedYear}-${String(selectedMonth).padStart(2, '0')}`;
        return transactions.filter(t => {
          // Filtro de Mês/Período
          if (filtroPeriodoDiario === 'mes' && (!t.date || !t.date.startsWith(ymStr))) {
            return false;
          }

          // Filtro de Titular
          if (filtroTitularDiario !== 'todos' && t.titular !== filtroTitularDiario) {
            return false;
          }

          const transPost = postings.filter(p => p.transaction_id === t.id);
          const debitPosting = transPost.find(p => p.amount > 0);
          const creditPosting = transPost.find(p => p.amount < 0);
          const debitAcc = debitPosting ? accounts.find(a => a.id === debitPosting.account_id) : null;
          const creditAcc = creditPosting ? accounts.find(a => a.id === creditPosting.account_id) : null;
          const isReceita = (creditAcc && creditAcc.account_type === 'REVENUE') || (debitAcc && debitAcc.account_type === 'REVENUE');
          const isPending = t.status === 'pending';

          if (filtroStatusDiario === 'recebido') return isReceita && !isPending;
          if (filtroStatusDiario === 'pago') return !isReceita && !isPending;
          if (filtroStatusDiario === 'a_receber') return isReceita && isPending;
          if (filtroStatusDiario === 'a_pagar') return !isReceita && isPending;

          return true;
        });
      }, [transactions, postings, accounts, filtroTitularDiario, filtroStatusDiario, filtroPeriodoDiario, selectedYear, selectedMonth]);

      const alternarStatusTransacao = async (transId, currentStatus) => {
        const newStatus = currentStatus === 'pending' ? 'completed' : 'pending';
        const upd = transactions.map(t => t.id === transId ? { ...t, status: newStatus } : t);
        setTransactions(upd);
        localStorage.setItem('fin_trans_v3', JSON.stringify(upd));

        if (supabase) {
          try {
            await supabase.from('transactions').update({ status: newStatus }).eq('id', transId);
            await carregarDados();
          } catch (e) {
            console.error("Erro ao atualizar status:", e);
          }
        }
        triggerHaptic('success');
        showToast(newStatus === 'completed' ? "Marcado como Pago / Recebido! ✅" : "Marcado como Pendente ⏳");
      };

      const salvarTransacao = async (date, description, rawPostings, ownershipType = 'owner_only', transactionIdToUpdate = null, recurrenceId = null, recurrenceDate = null, recurrenceConfig = null, titular = 'Ambos', status = 'completed') => {
        const sum = rawPostings.reduce((acc, p) => acc + Number(p.amount), 0);
        if (Math.abs(sum) > 0.001) {
          triggerHaptic('error');
          showToast(`Erro Contábil: A soma dos débitos e créditos (R$ ${sum.toFixed(2)}) não é zero!`);
          return false;
        }

        const isEditing = Boolean(transactionIdToUpdate);
        const transId = isEditing ? transactionIdToUpdate : generateUUID();
        
        let finalRecurrenceId = recurrenceId;
        let finalRecurrenceDate = recurrenceDate;

        // Se o usuário marcou a opção de criar série recorrente no próprio modal
        if (recurrenceConfig && recurrenceConfig.enabled && !isEditing) {
          finalRecurrenceId = generateUUID();
          finalRecurrenceDate = date;

          const patternObj = {
            id: finalRecurrenceId,
            description: description.trim(),
            rrule: recurrenceConfig.rrule,
            template_postings: rawPostings,
            start_date: date,
            end_date: recurrenceConfig.end_date || null,
            titular: titular || 'Ambos',
            ownership_type: ownershipType,
            active: true,
            created_at: new Date().toISOString()
          };

          await salvarRegraRecorrencia(patternObj);
        }

        const transObj = {
          id: transId,
          date,
          description,
          titular: titular || 'Ambos',
          status: status || 'completed',
          ownership_type: ownershipType,
          recurrence_id: finalRecurrenceId,
          recurrence_date: finalRecurrenceDate,
          created_at: new Date().toISOString()
        };

        const newPostingsList = rawPostings.map(p => ({
          id: generateUUID(),
          transaction_id: transId,
          account_id: p.account_id,
          amount: Number(p.amount),
          memo: p.memo || ''
        }));

        if (!supabase) {
          let updTrans, updPost;
          if (isEditing) {
            updTrans = transactions.map(t => t.id === transId ? { ...t, date, description, titular, status, ownership_type: ownershipType } : t);
            updPost = postings.filter(p => p.transaction_id !== transId).concat(newPostingsList);
          } else {
            updTrans = [transObj, ...transactions];
            updPost = [...postings, ...newPostingsList];
          }
          setTransactions(updTrans);
          setPostings(updPost);
          localStorage.setItem('fin_trans_v3', JSON.stringify(updTrans));
          localStorage.setItem('fin_post_v3', JSON.stringify(updPost));
          triggerHaptic('success');
          showToast(finalRecurrenceId && !recurrenceConfig ? "Ocorrência efetivada com sucesso!" : (isEditing ? "Lançamento atualizado!" : "Lançamento gravado!"));
          return true;
        }

        try {
          if (isEditing) {
            const { error: rpcErr } = await supabase.rpc('update_transaction_with_postings', {
              p_transaction_id: transId,
              p_date: date,
              p_description: description,
              p_postings: rawPostings,
              p_ownership_type: ownershipType,
              p_titular: titular,
              p_status: status
            });
            if (rpcErr) {
              await supabase.from('transactions').update({ date, description, titular, status, ownership_type: ownershipType }).eq('id', transId);
              await supabase.from('postings').delete().eq('transaction_id', transId);
              await supabase.from('postings').insert(newPostingsList);
            }
          } else {
            const { data: rpcTransId, error: rpcErr } = await supabase.rpc('create_transaction_with_postings', {
              p_date: date,
              p_description: description,
              p_postings: rawPostings,
              p_ownership_type: ownershipType,
              p_recurrence_id: finalRecurrenceId,
              p_recurrence_date: finalRecurrenceDate,
              p_titular: titular,
              p_status: status
            });
            if (rpcErr) {
              await supabase.from('transactions').insert([transObj]);
              await supabase.from('postings').insert(newPostingsList);
            }
          }

          // REFRESH TOTAL INSTANTÂNEO DIRETO DO BANCO
          await carregarDados();

          triggerHaptic('success');
          showToast(recurrenceConfig?.enabled ? "Lançamento gravado e série programada!" : "Lançamento salvo no PostgreSQL!");
          return true;
        } catch (err) {
          triggerHaptic('error');
          showToast(`Falha contábil: ${err.message}`);
          return false;
        }
      };

      const salvarRegraRecorrencia = async (data) => {
        const id = data.id || generateUUID();
        const obj = {
          id,
          description: data.description.trim(),
          rrule: data.rrule,
          template_postings: data.template_postings,
          start_date: data.start_date,
          end_date: data.end_date || null,
          titular: data.titular || 'Ambos',
          ownership_type: data.ownership_type || 'owner_only',
          active: data.active !== false,
          created_at: data.created_at || new Date().toISOString()
        };

        const upd = data.id ? recurringPatterns.map(r => r.id === id ? obj : r) : [...recurringPatterns, obj];
        setRecurringPatterns(upd);
        localStorage.setItem('fin_rec_v3', JSON.stringify(upd));

        if (supabase) {
          try {
            const { error } = await supabase.from('recurring_patterns').upsert(obj);
            if (error) throw error;
            await carregarDados();
          } catch (err) {
            console.error("Erro ao salvar recorrência no Supabase:", err);
            showToast(`Erro ao gravar no banco: ${err.message}`);
            return;
          }
        }

        triggerHaptic('success');
        showToast(data.id ? "Regra de recorrência atualizada!" : "Nova série recorrente programada!");
        setModalRecorrencia({ show: false, pattern: null });
      };

      const desativarRecorrencia = async (recId) => {
        const upd = recurringPatterns.filter(r => r.id !== recId);
        setRecurringPatterns(upd);
        localStorage.setItem('fin_rec_v3', JSON.stringify(upd));
        if (supabase) {
          try {
            await supabase.from('recurring_patterns').delete().eq('id', recId);
            await carregarDados();
          } catch (err) {
            console.error("Erro ao deletar recorrência:", err);
          }
        }
        triggerHaptic('warning');
        showToast("Série recorrente encerrada.");
      };

      const salvarMesRecorrencia = async (pattern, item, newDate, newAmount, newStatus) => {
        const isExpense = (pattern.template_postings || []).some(p => {
          const a = accounts.find(acc => acc.id === p.account_id);
          return a?.account_type === 'EXPENSE';
        });

        const catPost = (pattern.template_postings || []).find(p => {
          const a = accounts.find(acc => acc.id === p.account_id);
          return a && (a.account_type === 'EXPENSE' || a.account_type === 'REVENUE');
        });
        const bankPost = (pattern.template_postings || []).find(p => {
          const a = accounts.find(acc => acc.id === p.account_id);
          return a && (a.account_type === 'ASSET' || a.account_type === 'LIABILITY');
        });

        const catId = catPost ? catPost.account_id : accounts.find(a => a.account_type === (isExpense ? 'EXPENSE' : 'REVENUE'))?.id;
        const bankId = bankPost ? bankPost.account_id : accounts.find(a => a.account_type === 'ASSET' || a.account_type === 'LIABILITY')?.id;

        const postingsData = isExpense
          ? [
              { account_id: catId, amount: Number(newAmount) },
              { account_id: bankId, amount: -Number(newAmount) }
            ]
          : [
              { account_id: bankId, amount: Number(newAmount) },
              { account_id: catId, amount: -Number(newAmount) }
            ];

        const desc = `${pattern.description} (${item.installment})`;
        const transId = item.transactionId || null;

        await salvarTransacao(
          newDate,
          desc,
          postingsData,
          pattern.ownership_type || 'owner_only',
          transId,
          pattern.id,
          item.originalDate,
          null,
          pattern.titular || 'Ambos',
          newStatus
        );

        triggerHaptic('success');
        showToast(`Mês (${item.installment}) de "${pattern.description}" atualizado com sucesso!`);
      };

      const alternarStatusMesRecorrencia = async (pattern, item) => {
        const newStatus = item.isEfetivado ? 'pending' : 'completed';
        await salvarMesRecorrencia(pattern, item, item.currentDate, item.amount, newStatus);
      };

      const confirmarEfetivacao = async () => {
        const occ = modalEfetivacao.occurrence;
        if (!occ) return;
        const valorFinal = parseFloat(modalEfetivacao.customAmount);
        if (isNaN(valorFinal) || valorFinal <= 0) {
          showToast("Insira um valor válido.");
          return;
        }

        const templateTotal = occ.template_postings.filter(p => p.amount > 0).reduce((s, p) => s + p.amount, 0);
        const ratio = templateTotal > 0 ? valorFinal / templateTotal : 1;

        const customPostings = occ.template_postings.map(p => ({
          account_id: p.account_id,
          amount: Number((p.amount * ratio).toFixed(2))
        }));

        const sumDiff = customPostings.reduce((s, p) => s + p.amount, 0);
        if (Math.abs(sumDiff) > 0.0001 && customPostings.length > 0) {
          customPostings[0].amount = Number((customPostings[0].amount - sumDiff).toFixed(2));
        }

        await salvarTransacao(occ.date, occ.description, customPostings, occ.ownership_type || 'owner_only', null, occ.pattern_id, occ.date);
        setModalEfetivacao({ show: false, occurrence: null, customAmount: 0 });
      };

      // Edição Dinâmica de Valor de Vencimento/Previsão (Sincronizado com Regras Recorrentes e Diário)
      const salvarEdicaoVencimento = async (item, novoValor, novaData, novaDescricao, modoRecorrencia) => {
        const val = parseFloat(novoValor);
        if (isNaN(val) || val <= 0) {
          triggerHaptic('error');
          showToast("Informe um valor válido maior que zero.");
          return;
        }

        try {
          if (item.is_virtual) {
            const occ = item.occurrence;
            const pat = recurringPatterns.find(r => r.id === occ.pattern_id);

            if (modoRecorrencia === 'todas' && pat) {
              // 1. Atualiza a regra geral de recorrência (recurring_patterns)
              const novosTemplatePostings = (pat.template_postings || []).map(p => ({
                account_id: p.account_id,
                amount: p.amount > 0 ? val : -val
              }));

              const patAtualizado = {
                ...pat,
                description: novaDescricao ? novaDescricao.trim() : pat.description,
                template_postings: novosTemplatePostings
              };

              await salvarRegraRecorrencia(patAtualizado);
              showToast("Regra recorrente atualizada no Dashboard e na aba de Recorrências! 🔄");
            } else {
              // 2. Apenas nesta ocorrência do mês: grava como transação pendente com o novo valor
              const transPostings = (occ.template_postings || []).map(p => ({
                account_id: p.account_id,
                amount: p.amount > 0 ? val : -val
              }));

              await salvarTransacao(
                novaData || occ.date,
                novaDescricao ? novaDescricao.trim() : occ.description,
                transPostings,
                occ.ownership_type || 'owner_only',
                null,
                pat?.id || occ.pattern_id,
                occ.date,
                null,
                occ.titular || 'Ambos',
                'pending'
              );
              showToast("Valor ajustado para este mês específico!");
            }
          } else {
            // Transação manual/avulsa existente
            const trans = item.transaction;
            const existingPostings = postings.filter(p => p.transaction_id === trans.id);
            const novosPostings = existingPostings.map(p => ({
              account_id: p.account_id,
              amount: p.amount > 0 ? val : -val
            }));

            await salvarTransacao(
              novaData || trans.date,
              novaDescricao ? novaDescricao.trim() : trans.description,
              novosPostings,
              trans.ownership_type || 'owner_only',
              null,
              trans.recurrence_id || null,
              trans.recurrence_date || null,
              trans.id,
              trans.titular || 'Ambos',
              trans.status || 'pending'
            );
            showToast("Vencimento atualizado com sucesso!");
          }

          setModalEditarVencimento({ show: false, item: null, novoValor: 0, novaData: '', novaDescricao: '', modoRecorrencia: 'todas' });
          await carregarDados();
        } catch (err) {
          console.error("Erro ao salvar edição de vencimento:", err);
          showToast(`Erro ao atualizar: ${err.message}`);
        }
      };

      const salvarReavaliacaoInvestimento = async ({ id, accountId, date, previousAmount, newAmount, notes, titular, criarLancamentoContabil }) => {
        const prevVal = Number(previousAmount) || 0;
        const newVal = Number(newAmount) || 0;
        const diff = newVal - prevVal;
        const pct = prevVal > 0 ? ((diff / prevVal) * 100) : (newVal > 0 ? 100 : 0);
        const targetAcc = accounts.find(a => a.id === accountId);
        const accName = targetAcc?.name || 'Investimento';

        // Dispara celebração (confetes e vibração tátil) quando o Delta for positivo
        if (diff > 0) {
          dispararCelebracao();
        }

        const valuationObj = {
          id: id || generateUUID(),
          account_id: accountId,
          date,
          previous_amount: prevVal,
          new_amount: newVal,
          variation_amount: Number(diff.toFixed(2)),
          variation_pct: Number(pct.toFixed(4)),
          notes: notes ? notes.trim() : (diff >= 0 ? 'Rendimento / Aporte do Período' : 'Variação Negativa de Mercado'),
          titular: titular || targetAcc?.titular || 'Ambos',
          created_at: new Date().toISOString()
        };

        let updVal;
        if (id) {
          updVal = investmentValuations.map(v => v.id === id ? valuationObj : v).sort((a, b) => a.date.localeCompare(b.date));
        } else {
          updVal = [...investmentValuations, valuationObj].sort((a, b) => a.date.localeCompare(b.date));
        }

        setInvestmentValuations(updVal);
        localStorage.setItem('fin_invest_val_v3', JSON.stringify(updVal));

        // LÓGICA CONTÁBIL DE RECONCILIAÇÃO (O DELTA - MARCAÇÃO A MERCADO):
        // É expressamente proibido sobrescrever ou dar UPDATE direto no saldo.
        // O saldo é sempre derivado das transações contábeis de partidas dobradas.
        if (criarLancamentoContabil && Math.abs(diff) > 0.001) {
          let receitaRendimentoAcc = accounts.find(a => a.account_type === 'REVENUE' && (a.subtype === 'investment' || a.name.toLowerCase().includes('rendimento') || a.name.toLowerCase().includes('invest')));
          let despesaOscilacaoAcc = accounts.find(a => a.account_type === 'EXPENSE' && (a.name.toLowerCase().includes('variação negativa') || a.name.toLowerCase().includes('oscilação') || a.name.toLowerCase().includes('mercado') || a.name.toLowerCase().includes('invest')));

          if (!receitaRendimentoAcc) receitaRendimentoAcc = accounts.find(a => a.account_type === 'REVENUE');
          if (!despesaOscilacaoAcc) despesaOscilacaoAcc = accounts.find(a => a.account_type === 'EXPENSE');

          const absDiff = Math.abs(diff);
          let rawPostings = [];
          let desc = '';

          if (diff > 0 && receitaRendimentoAcc) {
            // Delta Positivo (Lucro): Debita conta de Ativo ("Investimentos") e Credita conta de Receita ("Rendimentos de Investimento")
            rawPostings = [
              { account_id: accountId, amount: Number(absDiff.toFixed(2)) },
              { account_id: receitaRendimentoAcc.id, amount: -Number(absDiff.toFixed(2)) }
            ];
            desc = `Rendimento de Investimento: ${accName} (+${formatarMoeda(absDiff)})`;
          } else if (diff < 0 && despesaOscilacaoAcc) {
            // Delta Negativo (Prejuízo): Credita conta de Ativo ("Investimentos") e Debita conta de Despesa ("Variação Negativa de Mercado")
            rawPostings = [
              { account_id: despesaOscilacaoAcc.id, amount: Number(absDiff.toFixed(2)) },
              { account_id: accountId, amount: -Number(absDiff.toFixed(2)) }
            ];
            desc = `Variação Negativa de Mercado: ${accName} (-${formatarMoeda(absDiff)})`;
          }

          if (rawPostings.length === 2) {
            await salvarTransacao(date, desc, rawPostings, 'owner_only', null, null, null, null, titular, 'completed');
          }
        }

        if (supabase) {
          try {
            await supabase.from('investment_valuations').upsert(valuationObj);
          } catch (e) {
            console.error("Erro ao salvar reavaliação no Supabase:", e);
          }
        }

        triggerHaptic(diff >= 0 ? 'success' : 'warning');
        
        let msgToast = id 
          ? `Reavaliação de "${accName}" atualizada com sucesso!` 
          : (diff > 0 
              ? `🎉 Parabéns! Seu patrimônio cresceu +${formatarMoeda(diff)} (+${pct.toFixed(2)}%) neste fechamento!`
              : (diff < 0 
                  ? `Posição atualizada: Variação de -${formatarMoeda(Math.abs(diff))} (-${Math.abs(pct).toFixed(2)}%) registrada.` 
                  : `Posição de "${accName}" confirmada sem alteração de saldo.`));

        showToast(msgToast);
        setModalReavaliacao({ show: false, account: null, valuation: null });
      };

      const excluirReavaliacaoInvestimento = async (id) => {
        const upd = investmentValuations.filter(v => v.id !== id);
        setInvestmentValuations(upd);
        localStorage.setItem('fin_invest_val_v3', JSON.stringify(upd));
        if (supabase) {
          try {
            await supabase.from('investment_valuations').delete().eq('id', id);
          } catch (e) {
            console.error("Erro ao deletar valuation:", e);
          }
        }
        triggerHaptic('warning');
        showToast("Registro de reavaliação removido.");
      };

      // Contas de Investimento e Posições Atuais
      const contasInvestimento = useMemo(() => {
        return accounts.filter(a => a.account_type === 'ASSET' && (a.subtype === 'investment' || a.name.toLowerCase().includes('invest') || a.name.toLowerCase().includes('selic') || a.name.toLowerCase().includes('cdb') || a.name.toLowerCase().includes('ações') || a.name.toLowerCase().includes('fii')));
      }, [accounts]);

      // Cálculo de Saldo Real por Titular para cada Conta de Investimento
      const getInvestimentoTitularBreakdown = (accId) => {
        let edvanTotal = 0;
        let yasminTotal = 0;
        let ambosTotal = 0;
        const targetAcc = accounts.find(a => a.id === accId);

        postings.forEach(p => {
          if (p.account_id !== accId) return;
          const trans = transactions.find(t => t.id === p.transaction_id);
          const amt = Math.abs(Number(p.amount)) || 0;
          if (amt === 0) return;

          const isEd = isOwnerInvest(trans, targetAcc);
          const isYas = isPartnerInvest(trans, targetAcc);

          if (isEd && !isYas) {
            edvanTotal += amt;
          } else if (isYas && !isEd) {
            yasminTotal += amt;
          } else {
            const desc = (trans?.description || '').toLowerCase();
            if (ownerName && desc.includes(ownerName.toLowerCase())) {
              edvanTotal += amt;
            } else if (partnerName && desc.includes(partnerName.toLowerCase())) {
              yasminTotal += amt;
            } else {
              ambosTotal += amt;
            }
          }
        });

        // Se a própria conta tem titularidade individual estrita e não teve transações separadas
        if (targetAcc) {
          const isAccEd = isOwnerInvest(null, targetAcc);
          const isAccYas = isPartnerInvest(null, targetAcc);
          const accBal = Math.abs(accountBalances[accId] || 0);

          if (isAccEd && !isAccYas && edvanTotal === 0) {
            edvanTotal = accBal;
          } else if (isAccYas && !isAccEd && yasminTotal === 0) {
            yasminTotal = accBal;
          }
        }

        const totalGeral = edvanTotal + yasminTotal + ambosTotal;

        return {
          edvan: edvanTotal,
          yasmin: yasminTotal,
          ambos: ambosTotal,
          geral: totalGeral || Math.abs(accountBalances[accId] || 0)
        };
      };

      // Saldo do Investimento Ponderado pela Visão Selecionada
      const getInvestimentoBalance = (acc) => {
        const breakdown = getInvestimentoTitularBreakdown(acc.id);
        if (filtroTitularInvestimento === 'owner') return breakdown.edvan;
        if (filtroTitularInvestimento === 'partner') return breakdown.yasmin;
        return breakdown.geral;
      };

      // Contas de Investimento filtradas pela titularidade selecionada
      const contasInvestimentoFiltradas = useMemo(() => {
        return contasInvestimento.filter(a => {
          if (filtroTitularInvestimento === 'geral') return true;
          const breakdown = getInvestimentoTitularBreakdown(a.id);
          if (filtroTitularInvestimento === 'owner') {
            return breakdown.edvan > 0 || isOwnerInvest(null, a);
          }
          if (filtroTitularInvestimento === 'partner') {
            return breakdown.yasmin > 0 || isPartnerInvest(null, a);
          }
          return true;
        });
      }, [contasInvestimento, filtroTitularInvestimento, ownerName, partnerName, postings, transactions, accounts, accountBalances]);

      const totalInvestidoAtual = useMemo(() => {
        return contasInvestimento.reduce((sum, a) => sum + getInvestimentoBalance(a), 0);
      }, [contasInvestimento, filtroTitularInvestimento, ownerName, partnerName, postings, transactions, accounts, accountBalances]);

      // Histórico de Valuations Filtrado por Titularidade e por Conta
      const historicoValuationsFiltrado = useMemo(() => {
        return investmentValuations
          .filter(v => {
            // Filtro estrito por Titularidade
            if (filtroTitularInvestimento === 'owner') {
              if (!isOwnerInvest(v, null)) return false;
            } else if (filtroTitularInvestimento === 'partner') {
              if (!isPartnerInvest(v, null)) return false;
            }

            // Filtro por Conta
            if (filtroInvestimentoConta !== 'todos' && v.account_id !== filtroInvestimentoConta) {
              return false;
            }
            return true;
          })
          .sort((a, b) => b.date.localeCompare(a.date));
      }, [investmentValuations, filtroTitularInvestimento, filtroInvestimentoConta, ownerName, partnerName]);

      // Resumo de KPIs filtrado pela titularidade selecionada
      const resumoInvestimentos = useMemo(() => {
        const valuationsDoTitular = investmentValuations.filter(v => {
          if (filtroTitularInvestimento === 'owner') return isOwnerInvest(v, null);
          if (filtroTitularInvestimento === 'partner') return isPartnerInvest(v, null);
          return true;
        });

        const totalGanhos = valuationsDoTitular.reduce((sum, v) => sum + (v.variation_amount > 0 ? v.variation_amount : 0), 0);
        const totalPerdas = valuationsDoTitular.reduce((sum, v) => sum + (v.variation_amount < 0 ? Math.abs(v.variation_amount) : 0), 0);

        const rendimentoLiquido = totalGanhos - totalPerdas;
