                </select>
              </div>

              <div>
                <label className="block font-bold text-slate-600 dark:text-slate-400 mb-1">Status</label>
                <select
                  value={isActive ? 'true' : 'false'}
                  onChange={e => setIsActive(e.target.value === 'true')}
                  className="w-full p-2.5 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl outline-none"
                >
                  <option value="true">Ativo</option>
                  <option value="false">Inativo (Soft Delete)</option>
                </select>
              </div>
            </div>

            <div>
              <label className="block font-bold text-slate-600 dark:text-slate-400 mb-2">Cor de Identificação Visual</label>
              <div className="flex items-center gap-2 flex-wrap">
                {cores.map(c => (
                  <button
                    key={c}
                    type="button"
                    onClick={() => setColor(c)}
                    className={`w-7 h-7 rounded-full transition-transform ${color === c ? 'scale-125 ring-2 ring-indigo-500 ring-offset-2 dark:ring-offset-slate-900' : 'hover:scale-110'}`}
                    style={{ backgroundColor: c }}
                  />
                ))}
              </div>
            </div>

            <div className="flex gap-2 pt-2">
              <button type="button" onClick={onClose} className="flex-1 py-3 bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-400 font-bold rounded-2xl tap-target">Cancelar</button>
              <button
                type="button"
                onClick={() => {
                  if (!name.trim()) {
                    triggerHaptic('error');
                    alert("Informe o nome da categoria ou conta.");
                    return;
                  }
                  onSave({
                    id: account?.id,
                    name,
                    account_type: accountType,
                    subtype,
                    titular,
                    color,
                    is_active: isActive,
                    created_at: account?.created_at
                  });
                }}
                className="flex-1 py-3 bg-indigo-600 hover:bg-indigo-500 text-white font-bold rounded-2xl shadow-lg shadow-indigo-600/30 tap-target"
              >
                {mode === 'edit' ? 'Salvar Alterações' : 'Criar Categoria'}
              </button>
            </div>
          </div>
        </div>
      );
    }

    function RecurrenceFormModal({ pattern, accounts, ownerName, partnerName, onClose, onSave, formatarMoeda }) {
      const existingParts = useMemo(() => {
        const parts = {};
        (pattern?.rrule || '').replace(/^RRULE:/i, '').split(';').forEach(p => {
          const [k, v] = p.split('=');
          if (k && v) parts[k.trim().toUpperCase()] = v.trim();
        });
        return parts;
      }, [pattern]);

      const [desc, setDesc] = useState(pattern?.description || '');
      const [opType, setOpType] = useState(() => {
        if (!pattern) return 'despesa';
        const firstPost = pattern.template_postings?.[0];
        const acc = accounts.find(a => a.id === firstPost?.account_id);
        return acc?.account_type === 'REVENUE' ? 'receita' : 'despesa';
      });

      const [amount, setAmount] = useState(() => {
        if (!pattern) return 100;
        const p = (pattern.template_postings || []).find(x => x.amount > 0);
        return p ? p.amount : 100;
      });

      const [freq, setFreq] = useState(existingParts.FREQ || 'MONTHLY');
      const [dayOfMonth, setDayOfMonth] = useState(parseInt(existingParts.BYMONTHDAY || '10', 10));
      const [startDate, setStartDate] = useState(pattern?.start_date || new Date().toISOString().split('T')[0]);
      
      // Duração e Quantidade de Meses
      const [durationMode, setDurationMode] = useState(() => (existingParts.COUNT || pattern?.end_date ? 'meses' : 'continua'));
      const [monthCount, setMonthCount] = useState(() => parseInt(existingParts.COUNT || '12', 10));

      const [titular, setTitular] = useState(pattern?.titular || 'Ambos');
      const [ownershipType, setOwnershipType] = useState(pattern?.ownership_type || 'owner_only');
      const [catId, setCatId] = useState(() => {
        const cat = (pattern?.template_postings || []).find(p => {
          const a = accounts.find(acc => acc.id === p.account_id);
          return a && (a.account_type === 'EXPENSE' || a.account_type === 'REVENUE');
        });
        if (cat) return cat.account_id;
        return accounts.find(a => a.account_type === 'EXPENSE' || a.account_type === 'REVENUE')?.id || '';
      });

      const [bankId, setBankId] = useState(() => {
        const b = (pattern?.template_postings || []).find(p => {
          const a = accounts.find(acc => acc.id === p.account_id);
          return a && (a.account_type === 'ASSET' || a.account_type === 'LIABILITY');
        });
        if (b) return b.account_id;
        return accounts.find(a => a.account_type === 'ASSET' || a.account_type === 'LIABILITY')?.id || '';
      });

      const numVal = parseFloat(amount) || 0;
      const mesesVal = parseInt(monthCount, 10) || 1;

      const custoEstimado = useMemo(() => {
        if (freq === 'MONTHLY') {
          return durationMode === 'meses' ? numVal * mesesVal : numVal * 12;
        }
        if (freq === 'WEEKLY') return numVal * 52;
        if (freq === 'YEARLY') return numVal;
        return numVal * 12;
      }, [numVal, mesesVal, durationMode, freq]);

      const dataTerminoEstimada = useMemo(() => {
        if (durationMode !== 'meses' || freq !== 'MONTHLY') return null;
        const [sY, sM, sD] = startDate.split('-').map(Number);
        const d = new Date(sY, sM - 1 + mesesVal, Math.min(sD, dayOfMonth || 10));
        return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
      }, [startDate, mesesVal, durationMode, freq, dayOfMonth]);

      return (
        <div className="fixed inset-0 bg-slate-950/70 backdrop-blur-sm flex items-center justify-center p-4 z-[99999] animate-in fade-in">
          <div className="bg-white dark:bg-slate-900 rounded-3xl p-6 max-w-md w-full border border-slate-200 dark:border-slate-800 shadow-2xl space-y-4 text-xs max-h-[90vh] overflow-y-auto">
            <div className="flex justify-between items-center">
              <h3 className="font-bold text-sm text-slate-900 dark:text-white flex items-center gap-2">
                <RepeatIcon /> {pattern ? 'Editar Regra Recorrente' : 'Nova Regra Recorrente'}
              </h3>
              <button onClick={onClose} className="text-slate-400 hover:text-white tap-target">✕</button>
            </div>

            <div className="grid grid-cols-2 gap-3">
              <div>
                <label className="block font-bold text-slate-600 dark:text-slate-400 mb-1">Tipo de Fluxo</label>
                <select value={opType} onChange={e => setOpType(e.target.value)} className="w-full p-2.5 bg-slate-50 dark:bg-slate-800 border rounded-xl outline-none font-semibold">
                  <option value="despesa">Despesa (Assinatura/Parcela)</option>
                  <option value="receita">Receita (Salário/Rendimento)</option>
                </select>
              </div>
              <div>
                <label className="block font-bold text-slate-600 dark:text-slate-400 mb-1">Titular</label>
                <select value={titular} onChange={e => setTitular(e.target.value)} className="w-full p-2.5 bg-slate-50 dark:bg-slate-800 border rounded-xl outline-none font-semibold">
                  <option value={ownerName || 'Eu'}>{ownerName || 'Eu'}</option>
                  {partnerName && <option value={partnerName}>{partnerName}</option>}
                  {partnerName && <option value="Ambos">Ambos / Casal</option>}
                </select>
              </div>
            </div>

            <div>
              <label className="block font-bold text-slate-600 dark:text-slate-400 mb-1">Descrição</label>
              <input value={desc} onChange={e => setDesc(e.target.value)} placeholder="Ex: iPhone 10x, Netflix, Aluguel" className="w-full p-2.5 bg-slate-50 dark:bg-slate-800 border rounded-xl outline-none font-medium" />
            </div>

            <div className="grid grid-cols-2 gap-3">
              <div>
                <label className="block font-bold text-slate-600 dark:text-slate-400 mb-1">Categoria</label>
                <select value={catId} onChange={e => setCatId(e.target.value)} className="w-full p-2.5 bg-slate-50 dark:bg-slate-800 border rounded-xl outline-none font-medium">
                  {accounts.filter(a => a.account_type === (opType === 'despesa' ? 'EXPENSE' : 'REVENUE')).map(a => <option key={a.id} value={a.id}>{a.name}</option>)}
                </select>
              </div>
              <div>
                <label className="block font-bold text-slate-600 dark:text-slate-400 mb-1">Conta / Cartão</label>
                <select value={bankId} onChange={e => setBankId(e.target.value)} className="w-full p-2.5 bg-slate-50 dark:bg-slate-800 border rounded-xl outline-none font-medium">
                  {accounts.filter(a => a.account_type === 'ASSET' || a.account_type === 'LIABILITY').map(a => <option key={a.id} value={a.id}>{a.name}</option>)}
                </select>
              </div>
            </div>

            <div className="grid grid-cols-2 gap-3">
              <div>
                <label className="block font-bold text-slate-600 dark:text-slate-400 mb-1">Frequência</label>
                <select value={freq} onChange={e => setFreq(e.target.value)} className="w-full p-2.5 bg-slate-50 dark:bg-slate-800 border rounded-xl outline-none font-semibold">
                  <option value="MONTHLY">Mensal</option>
                  <option value="WEEKLY">Semanal</option>
                  <option value="YEARLY">Anual</option>
                </select>
              </div>
              <div>
                <label className="block font-bold text-slate-600 dark:text-slate-400 mb-1">Dia do Vencimento</label>
                <input type="number" min="1" max="31" value={dayOfMonth} onChange={e => setDayOfMonth(parseInt(e.target.value, 10) || 1)} className="w-full p-2.5 bg-slate-50 dark:bg-slate-800 border rounded-xl outline-none font-mono font-bold" />
              </div>
            </div>

            {/* SELETOR DE QUANTIDADE DE MESES (QUANDO MENSAL) */}
            {freq === 'MONTHLY' && (
              <div className="p-3 bg-slate-50 dark:bg-slate-800/80 rounded-2xl border border-slate-200 dark:border-slate-700 space-y-3">
                <label className="block font-bold text-slate-700 dark:text-slate-300 text-xs">Duração do Agendamento</label>
                
                <div className="grid grid-cols-2 gap-2">
                  <button
                    type="button"
                    onClick={() => setDurationMode('continua')}
                    className={`py-2 px-3 rounded-xl font-bold text-xs transition border ${durationMode === 'continua' ? 'bg-indigo-600 text-white border-indigo-600 shadow-md' : 'bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-300 border-slate-200 dark:border-slate-700'}`}
                  >
                    ♾️ Contínua (Sem Fim)
                  </button>
                  <button
                    type="button"
                    onClick={() => setDurationMode('meses')}
                    className={`py-2 px-3 rounded-xl font-bold text-xs transition border ${durationMode === 'meses' ? 'bg-indigo-600 text-white border-indigo-600 shadow-md' : 'bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-300 border-slate-200 dark:border-slate-700'}`}
                  >
                    📅 Quantidade de Meses
                  </button>
                </div>

                {durationMode === 'meses' && (
                  <div className="pt-1 space-y-2">
                    <div className="flex justify-between items-center">
                      <label className="text-[11px] font-bold text-slate-600 dark:text-slate-400">Total de Meses / Parcelas</label>
                      <span className="text-xs font-mono font-black text-indigo-600 dark:text-indigo-400">{mesesVal} meses</span>
                    </div>
                    <div className="flex items-center gap-2">
                      <input
                        type="number"
                        min="1"
                        max="120"
                        value={monthCount}
                        onChange={e => setMonthCount(Math.max(1, parseInt(e.target.value, 10) || 1))}
                        className="w-24 p-2 bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-600 rounded-xl text-center font-mono font-bold text-sm"
                      />
                      <div className="flex gap-1 flex-1 overflow-x-auto py-1">
                        {[2, 3, 6, 10, 12, 18, 24, 36, 48].map(n => (
                          <button
                            key={n}
                            type="button"
                            onClick={() => setMonthCount(n)}
                            className={`px-2 py-1 text-[11px] font-mono font-bold rounded-lg border transition ${mesesVal === n ? 'bg-indigo-100 dark:bg-indigo-950 text-indigo-700 dark:text-indigo-300 border-indigo-400' : 'bg-white dark:bg-slate-800 text-slate-500 border-slate-200 dark:border-slate-700'}`}
                          >
                            {n}x
                          </button>
                        ))}
                      </div>
                    </div>
                  </div>
                )}
              </div>
            )}

            <div className="grid grid-cols-2 gap-3">
              <div>
                <label className="block font-bold text-slate-600 dark:text-slate-400 mb-1">Data da 1ª Parcela</label>
                <input type="date" value={startDate} onChange={e => setStartDate(e.target.value)} className="w-full p-2.5 bg-slate-50 dark:bg-slate-800 border rounded-xl font-mono text-xs" />
              </div>
              <div>
                <label className="block font-bold text-slate-600 dark:text-slate-400 mb-1">Valor da Parcela (R$)</label>
                <input type="number" step="0.01" value={amount} onChange={e => setAmount(e.target.value)} className="w-full p-2.5 font-mono text-base font-bold bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-xl outline-none text-right" />
              </div>
            </div>

            {/* RATEIO DA RECORRÊNCIA (APENAS QUANDO HOUVER PARCEIRO NA FAMÍLIA) */}
            {opType === 'despesa' && partnerName && (
              <div>
                <label className="block font-bold text-slate-600 dark:text-slate-400 mb-1">Rateio Padrão da Recorrência</label>
                <select value={ownershipType} onChange={e => setOwnershipType(e.target.value)} className="w-full p-2.5 bg-slate-50 dark:bg-slate-800 border rounded-xl outline-none font-semibold">
                  <option value="owner_only">Só Meu ({ownerName || 'Eu'})</option>
                  <option value="shared_50_50">Dividido 50% / 50% (Casal)</option>
                  <option value="partner_only">Só de {partnerName}</option>
                </select>
              </div>
            )}

            {/* IMPACTO E PREVISIBILIDADE */}
            <div className="p-4 bg-indigo-50 dark:bg-indigo-950/40 rounded-2xl border border-indigo-200 dark:border-indigo-800/60 space-y-2">
              <span className="text-[10px] font-bold text-indigo-900 dark:text-indigo-300 uppercase tracking-wider block">
                Previsibilidade & Impacto Financeiro
              </span>
              <div className="flex justify-between items-center text-xs">
                <span className="text-slate-600 dark:text-slate-400">
                  {durationMode === 'meses' && freq === 'MONTHLY' ? `Total (${mesesVal} parcelas):` : 'Impacto Anual Estimado:'}
                </span>
                <span className="font-mono font-bold text-indigo-700 dark:text-indigo-300 text-sm">
                  {formatarMoeda(custoEstimado)}
                </span>
              </div>
              <div className="flex justify-between items-center text-[11px] text-slate-500 font-mono">
                <span>Vencimento: dia {dayOfMonth} de cada mês</span>
                <span>{dataTerminoEstimada ? `Término: ${dataTerminoEstimada}` : 'Contínuo'}</span>
              </div>
            </div>

            <div className="flex gap-2 pt-2">
              <button type="button" onClick={onClose} className="flex-1 py-3 bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-400 font-bold rounded-2xl tap-target">Cancelar</button>
              <button
                type="button"
                onClick={() => {
                  const val = parseFloat(amount);
                  if (isNaN(val) || val <= 0) {
                    alert("Informe um valor válido.");
                    return;
                  }
                  if (!desc.trim()) {
                    alert("Informe a descrição da recorrência.");
                    return;
                  }

                  let templatePostings = [];
                  if (opType === 'despesa') {
                    templatePostings = [
                      { account_id: catId, amount: val },
                      { account_id: bankId, amount: -val }
                    ];
                  } else {
                    templatePostings = [
                      { account_id: bankId, amount: val },
                      { account_id: catId, amount: -val }
                    ];
                  }

                  let rruleStr = `FREQ=${freq};BYMONTHDAY=${dayOfMonth};INTERVAL=1`;
                  let finalEndDate = null;

                  if (freq === 'MONTHLY' && durationMode === 'meses' && mesesVal > 0) {
                    rruleStr += `;COUNT=${mesesVal}`;
                    finalEndDate = dataTerminoEstimada;
                  }

                  onSave({
                    id: pattern?.id,
                    description: desc.trim(),
                    rrule: rruleStr,
                    template_postings: templatePostings,
                    start_date: startDate,
                    end_date: finalEndDate,
                    titular,
                    ownership_type: ownershipType
                  });
                }}
                className="flex-1 py-3 bg-indigo-600 hover:bg-indigo-500 text-white font-bold rounded-2xl shadow-lg shadow-indigo-600/30 tap-target"
              >
                Salvar Regra
              </button>
            </div>
          </div>
        </div>
      );
    }

    class ErrorBoundary extends React.Component {
      constructor(props) {
        super(props);
        this.state = { hasError: false, error: null };
      }
      static getDerivedStateFromError(error) {
        return { hasError: true, error };
      }
      componentDidCatch(error, info) {
        console.error("ErrorBoundary caught:", error, info);
      }
      render() {
        if (this.state.hasError) {
          return (
            <div className="p-8 bg-rose-50 dark:bg-rose-950 text-rose-900 dark:text-rose-100 min-h-screen font-sans">
              <h1 className="text-xl font-black text-rose-700 dark:text-rose-400 mb-2">Ops! Ocorreu um erro no carregamento da tela</h1>
              <p className="text-sm mb-4">Detalhes técnicos do erro:</p>
              <pre className="p-4 bg-white dark:bg-slate-900 rounded-xl border border-rose-200 dark:border-rose-800 text-xs font-mono overflow-auto max-w-full">
                {String(this.state.error?.stack || this.state.error?.message || this.state.error)}
              </pre>
              <button onClick={() => window.location.reload()} className="mt-4 px-4 py-2 bg-rose-600 hover:bg-rose-500 text-white font-bold rounded-xl text-sm">
                Recarregar Aplicação
              </button>
            </div>
          );
        }
        return this.props.children;
      }
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(
      <ErrorBoundary>
        <MainApp />
      </ErrorBoundary>
    );
  </script>
</body>
</html>
