                        onChange={e => setUserProfile({ ...userProfile, endereco: e.target.value })}
                        placeholder="Ex: Av. Paulista, 1000 - São Paulo, SP"
                        className="w-full p-2.5 bg-slate-50 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-xl text-xs outline-none focus:border-indigo-500"
                      />
                    </div>

                    {/* BOTÃO DE SALVAR COM LOADING SPINNER */}
                    <div className="pt-2">
                      <button
                        type="submit"
                        disabled={profileSaving || uploadingAvatar}
                        className="w-full py-3 bg-indigo-600 hover:bg-indigo-500 text-white font-bold rounded-2xl shadow-lg shadow-indigo-600/30 tap-target text-xs transition flex items-center justify-center gap-2 disabled:opacity-50"
                      >
                        {profileSaving ? (
                          <>
                            <span className="animate-spin text-sm">🔄</span>
                            <span>Salvando Alterações...</span>
                          </>
                        ) : (
                          <>
                            <span>💾</span>
                            <span>Salvar Alterações no Perfil</span>
                          </>
                        )}
                      </button>
                    </div>
                  </form>
                )}

                {/* ABA 2: GESTÃO DA FAMÍLIA (ADMIN DA FAMÍLIA) */}
                {configTab === 'familia' && (
                  <div className="space-y-4">
                    
                    {/* CARTÃO DA FAMÍLIA */}
                    <div className="p-4 bg-gradient-to-br from-indigo-50 to-purple-50 dark:from-slate-800 dark:to-indigo-950/60 rounded-2xl border border-indigo-200/80 dark:border-indigo-800/80 space-y-2">
                      <div className="flex justify-between items-start">
                        <div>
                          <span className="text-[10px] font-mono font-bold text-indigo-600 dark:text-indigo-400 uppercase tracking-wider block">
                            Espaço Familiar Ativo
                          </span>
                          <h4 className="font-black text-base text-slate-900 dark:text-white">
                            {familiaAtiva?.nome || (ownerName ? `Família de ${ownerName}` : 'Espaço Pessoal (Solo)')}
                          </h4>
                        </div>
                        <span className="px-2.5 py-1 rounded-xl text-[10px] font-mono font-bold bg-indigo-600 text-white shadow-sm">
                          👑 Dono da Família
                        </span>
                      </div>
                      
                      <div className="p-3 bg-white/80 dark:bg-slate-900/80 rounded-xl border border-indigo-100 dark:border-indigo-900/50 space-y-1.5 mt-2">
                        <div className="flex justify-between items-center text-[10px] uppercase font-bold text-slate-400">
                          <span>ID da Família (Compartilhe para entrar):</span>
                          <span>{membrosFamilia.length > 0 ? `${membrosFamilia.length} Membro(s)` : '1 Membro'}</span>
                        </div>
                        <div className="flex items-center gap-2">
                          <code className="flex-1 p-2 bg-slate-100 dark:bg-slate-800 rounded-lg text-indigo-700 dark:text-indigo-300 font-mono font-bold text-xs select-all break-all">
                            {familiaAtiva?.id || 'Solo (Individual)'}
                          </code>
                          {familiaAtiva?.id && (
                            <button
                              type="button"
                              onClick={() => {
                                navigator.clipboard.writeText(familiaAtiva.id);
                                showToast("📋 ID da Família copiado para a área de transferência!");
                              }}
                              className="px-3 py-2 bg-indigo-600 hover:bg-indigo-500 text-white font-bold rounded-lg text-xs shrink-0 flex items-center gap-1 shadow-sm tap-target"
                            >
                              📋 Copiar ID
                            </button>
                          )}
                        </div>
                      </div>
                    </div>

                    {/* LISTA DE MEMBROS */}
                    <div className="space-y-2">
                      <div className="flex justify-between items-center">
                        <span className="text-[11px] font-bold text-slate-400 uppercase tracking-wider">
                          Membros da Conta Familiar ({membrosFamilia.length > 0 ? membrosFamilia.length : 1})
                        </span>

                        <button
                          type="button"
                          onClick={() => {
                            setConfigOpen(false);
                            setModalConvite({ show: true, tab: 'gerar', codigoGerado: '', codigoParaEntrar: '', emailConvidado: '', nomeExibicao: '', loading: false });
                          }}
                          className="text-xs font-bold text-indigo-600 dark:text-indigo-400 hover:underline flex items-center gap-1"
                        >
                          ➕ Convidar Parceiro(a)
                        </button>
                      </div>

                      <div className="space-y-1.5 max-h-48 overflow-y-auto pr-1">
                        {(membrosFamilia.length > 0 ? membrosFamilia : [
                          { user_id: authUser?.id || 'me', nome_exibicao: ownerName || 'Eu', papel: 'admin' }
                        ]).map((m, idx) => (
                          <div key={idx} className="p-3 bg-slate-50 dark:bg-slate-800/80 rounded-xl flex justify-between items-center border border-slate-200/60 dark:border-slate-700/60">
                            <div className="flex items-center gap-2.5">
                              <span className="w-8 h-8 rounded-lg bg-indigo-100 dark:bg-indigo-950 text-indigo-600 dark:text-indigo-400 flex items-center justify-center font-bold text-xs">
                                👤
                              </span>
                              <div>
                                <span className="font-bold text-xs text-slate-900 dark:text-white block">
                                  {m.nome_exibicao || (m.user_id === authUser?.id ? ownerName || 'Eu' : 'Membro')}
                                </span>
                                <span className="text-[10px] text-slate-400 font-mono">
                                  Papel: {m.papel === 'admin' ? 'Dono (Admin)' : 'Membro Compartilhado'}
                                </span>
                              </div>
                            </div>

                            {m.papel !== 'admin' && (
                              <button
                                type="button"
                                onClick={() => handleRemoverMembro(m.user_id)}
                                className="px-2.5 py-1 text-[11px] font-bold bg-rose-50 dark:bg-rose-950/60 text-rose-600 dark:text-rose-400 rounded-lg hover:bg-rose-100 transition"
                              >
                                Remover
                              </button>
                            )}
                          </div>
                        ))}
                      </div>
                    </div>

                  </div>
                )}

                {/* FOOTER DO MODAL: BOTÃO DE LOGOUT */}
                <div className="pt-3 border-t border-slate-100 dark:border-slate-800">
                  <button
                    type="button"
                    onClick={() => {
                      setConfigOpen(false);
                      handleLogout();
                    }}
                    className="w-full py-2.5 bg-rose-50 dark:bg-rose-950/40 hover:bg-rose-100 dark:hover:bg-rose-900/40 text-rose-600 dark:text-rose-400 border border-rose-200 dark:border-rose-800/60 rounded-2xl text-xs font-bold flex items-center justify-center gap-2 transition tap-target"
                  >
                    <LogOutIcon /> Encerrar Sessão (Logout)
                  </button>
                </div>

              </div>
            </div>
          )}

        </div>
      );
    }

    // Modal de Criação / Edição de Transação com Segmented Control de Rateio & Recorrência Integrada
    function TransactionFormModal({ editingTransacao, activeAccounts, ownerName, partnerName, onClose, onSave, formatarMoeda }) {
      // 1. Detectar se a transação sendo editada é Receita ou Despesa
      const initialOpType = useMemo(() => {
        if (!editingTransacao) return 'despesa';
        const isRevenue = editingTransacao.postings.some(p => {
          const acc = activeAccounts.find(a => a.id === p.account_id);
          return acc && acc.account_type === 'REVENUE';
        });
        return isRevenue ? 'receita' : 'despesa';
      }, [editingTransacao, activeAccounts]);

      const [date, setDate] = useState(editingTransacao?.trans?.date || new Date().toISOString().split('T')[0]);
      const [opType, setOpType] = useState(initialOpType);
      const [titular, setTitular] = useState(editingTransacao?.trans?.titular || ownerName);
      const [status, setStatus] = useState(editingTransacao?.trans?.status || 'completed');
      const [description, setDescription] = useState(editingTransacao?.trans?.description || '');
      
      const [contaDespesa, setContaDespesa] = useState(() => {
        if (editingTransacao) {
          if (initialOpType === 'receita') {
            const p = editingTransacao.postings.find(x => {
              const acc = activeAccounts.find(a => a.id === x.account_id);
              return acc && acc.account_type === 'REVENUE';
            });
            if (p) return p.account_id;
          } else {
            const p = editingTransacao.postings.find(x => {
              const acc = activeAccounts.find(a => a.id === x.account_id);
              return acc && acc.account_type === 'EXPENSE';
            });
            if (p) return p.account_id;
          }
        }
        return activeAccounts.find(a => a.account_type === (initialOpType === 'despesa' ? 'EXPENSE' : 'REVENUE'))?.id || '';
      });

      const [contaOrigem, setContaOrigem] = useState(() => {
        if (editingTransacao) {
          const p = editingTransacao.postings.find(x => {
            const acc = activeAccounts.find(a => a.id === x.account_id);
            return acc && (acc.account_type === 'ASSET' || acc.account_type === 'LIABILITY');
          });
          if (p) return p.account_id;
        }
        return activeAccounts.find(a => a.account_type === 'ASSET' || a.account_type === 'LIABILITY')?.id || '';
      });

      const [valor, setValor] = useState(editingTransacao?.total || '');
      const [ownershipType, setOwnershipType] = useState(editingTransacao?.trans?.ownership_type || 'owner_only');

      // Troca dinâmica de tipo de operação com ajuste inteligente da categoria
      const handleOpTypeChange = (newOp) => {
        setOpType(newOp);
        const currentAcc = activeAccounts.find(a => a.id === contaDespesa);
        if (newOp === 'receita' && currentAcc?.account_type !== 'REVENUE') {
          const firstRev = activeAccounts.find(a => a.account_type === 'REVENUE');
          if (firstRev) setContaDespesa(firstRev.id);
        } else if (newOp === 'despesa' && currentAcc?.account_type !== 'EXPENSE') {
          const firstExp = activeAccounts.find(a => a.account_type === 'EXPENSE');
          if (firstExp) setContaDespesa(firstExp.id);
        }
      };

      // Recorrência & Parcelamento Integrados
      const [isRecurring, setIsRecurring] = useState(false);
      const [recDurationMode, setRecDurationMode] = useState('meses');
      const [recMonthCount, setRecMonthCount] = useState(12);

      const valorNumerico = parseFloat(valor) || 0;
      const valorDevidoParceiro = useMemo(() => {
        if (ownershipType === 'shared_50_50') return valorNumerico * 0.5;
        if (ownershipType === 'partner_only') return valorNumerico * 1.0;
        return 0;
      }, [ownershipType, valorNumerico]);

      const mesesVal = parseInt(recMonthCount, 10) || 1;
      const dataTerminoRecorrencia = useMemo(() => {
        if (!isRecurring || recDurationMode !== 'meses') return null;
        const [sY, sM, sD] = date.split('-').map(Number);
        const dayOfMonth = sD || 10;
        const d = new Date(sY, sM - 1 + mesesVal, dayOfMonth);
        return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
      }, [isRecurring, recDurationMode, date, mesesVal]);

      return (
        <div className="fixed inset-0 bg-slate-950/70 backdrop-blur-sm flex items-center justify-center p-4 z-[99999] animate-in fade-in">
          <div className="bg-white dark:bg-slate-900 rounded-3xl p-6 max-w-lg w-full border border-slate-200 dark:border-slate-800 shadow-2xl space-y-4 text-xs max-h-[90vh] overflow-y-auto">
            <div className="flex justify-between items-center">
              <h3 className="font-bold text-sm text-slate-900 dark:text-white flex items-center gap-2">
                <BookOpenIcon /> {editingTransacao ? 'Editar Lançamento Contábil' : 'Novo Lançamento Contábil'}
              </h3>
              <button onClick={onClose} className="text-slate-400 hover:text-white tap-target">✕</button>
            </div>

            <form onSubmit={async (e) => {
              e.preventDefault();
              const val = parseFloat(valor);
              if (isNaN(val) || val <= 0) {
                alert("Informe um valor válido.");
                return;
              }
              if (!description.trim()) {
                alert("Informe a descrição do lançamento.");
                return;
              }

              let rawPostings = [];
              if (opType === 'despesa') {
                rawPostings = [
                  { account_id: contaDespesa, amount: val },
                  { account_id: contaOrigem, amount: -val }
                ];
              } else {
                rawPostings = [
                  { account_id: contaOrigem, amount: val },
                  { account_id: contaDespesa, amount: -val }
                ];
              }

              let recConfig = null;
              if (isRecurring && !editingTransacao) {
                const dayOfMonth = parseInt(date.split('-')[2], 10) || 10;
                let rruleStr = `FREQ=MONTHLY;BYMONTHDAY=${dayOfMonth};INTERVAL=1`;
                if (recDurationMode === 'meses' && mesesVal > 0) {
                  rruleStr += `;COUNT=${mesesVal}`;
                }
                recConfig = {
                  enabled: true,
                  rrule: rruleStr,
                  end_date: dataTerminoRecorrencia,
                  titular: titular || 'Ambos'
                };
              }

              const finalOwnership = opType === 'receita' ? 'owner_only' : ownershipType;
              const ok = await onSave(date, description, rawPostings, finalOwnership, editingTransacao?.trans?.id, null, null, recConfig, titular, status);
              if (ok) onClose();
            }} className="space-y-4">

              {/* 1. SELEÇÃO DO TITULAR (QUEM REALIZOU O LANÇAMENTO) */}
              <div className="space-y-1.5">
                <label className="block font-bold text-slate-700 dark:text-slate-300 text-xs">
                  1. Titular do Lançamento (De quem é este lançamento?)
                </label>
                <div className="grid grid-cols-3 gap-1.5 p-1 bg-slate-100 dark:bg-slate-800/90 rounded-2xl border border-slate-200 dark:border-slate-700">
                  <button
                    type="button"
                    onClick={() => {
                      triggerHaptic('light');
                      setTitular(ownerName);
                      if (!editingTransacao) setOwnershipType('owner_only');
                    }}
                    className={`py-2 px-2 rounded-xl text-xs font-bold transition flex items-center justify-center gap-1.5 ${
                      titular === ownerName
                        ? 'bg-indigo-600 text-white shadow-md'
                        : 'text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white'
                    }`}
                  >
                    <span>👤</span> {ownerName}
                  </button>

                  <button
                    type="button"
                    onClick={() => {
                      triggerHaptic('light');
                      setTitular(partnerName);
                      if (!editingTransacao) setOwnershipType('partner_only');
                    }}
                    className={`py-2 px-2 rounded-xl text-xs font-bold transition flex items-center justify-center gap-1.5 ${
                      titular === partnerName
                        ? 'bg-purple-600 text-white shadow-md'
                        : 'text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white'
                    }`}
                  >
                    <span>👤</span> {partnerName}
                  </button>

                  <button
                    type="button"
                    onClick={() => {
                      triggerHaptic('light');
                      setTitular('Ambos');
                      if (!editingTransacao) setOwnershipType('shared_50_50');
                    }}
                    className={`py-2 px-2 rounded-xl text-xs font-bold transition flex items-center justify-center gap-1.5 ${
                      titular === 'Ambos'
                        ? 'bg-slate-800 dark:bg-slate-700 text-white shadow-md'
                        : 'text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white'
                    }`}
                  >
                    <span>👥</span> Ambos (Casal)
                  </button>
                </div>
              </div>

              {/* 2. RECEITA OU DESPESA (TIPO DE OPERAÇÃO) */}
              <div className="space-y-1.5">
                <label className="block font-bold text-slate-700 dark:text-slate-300 text-xs">
                  2. Tipo de Operação (Receita ou Despesa?)
                </label>
                <div className="grid grid-cols-2 gap-2 p-1 bg-slate-100 dark:bg-slate-800/90 rounded-2xl border border-slate-200 dark:border-slate-700">
                  <button
                    type="button"
                    onClick={() => { triggerHaptic('light'); handleOpTypeChange('despesa'); }}
                    className={`py-2.5 px-3 rounded-xl text-xs font-bold transition flex items-center justify-center gap-2 ${
                      opType === 'despesa'
                        ? 'bg-rose-600 text-white shadow-md'
                        : 'text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white'
                    }`}
                  >
                    <span>🔴</span> Despesa (Saída)
                  </button>

                  <button
                    type="button"
                    onClick={() => { triggerHaptic('light'); handleOpTypeChange('receita'); }}
                    className={`py-2.5 px-3 rounded-xl text-xs font-bold transition flex items-center justify-center gap-2 ${
                      opType === 'receita'
                        ? 'bg-emerald-600 text-white shadow-md'
                        : 'text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white'
                    }`}
                  >
                    <span>🟢</span> Receita (Entrada)
                  </button>
                </div>
              </div>

              {/* 3. STATUS DA OPERAÇÃO (PAGO / RECEBIDO VS PENDENTE) */}
              <div className="space-y-1.5">
                <label className="block font-bold text-slate-700 dark:text-slate-300 text-xs">
                  3. Status da Operação (Situação do Pagamento/Recebimento)
                </label>
                <div className="grid grid-cols-2 gap-2 p-1 bg-slate-100 dark:bg-slate-800/90 rounded-2xl border border-slate-200 dark:border-slate-700">
                  <button
                    type="button"
                    onClick={() => { triggerHaptic('light'); setStatus('completed'); }}
                    className={`py-2 px-3 rounded-xl text-xs font-bold transition flex items-center justify-center gap-1.5 ${
                      status === 'completed'
                        ? 'bg-emerald-600 text-white shadow-md'
                        : 'text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white'
                    }`}
                  >
                    <span>✅</span> {opType === 'despesa' ? 'Pago / Liquidado' : 'Recebido'}
                  </button>

                  <button
                    type="button"
                    onClick={() => { triggerHaptic('light'); setStatus('pending'); }}
                    className={`py-2 px-3 rounded-xl text-xs font-bold transition flex items-center justify-center gap-1.5 ${
                      status === 'pending'
                        ? 'bg-amber-600 text-white shadow-md'
                        : 'text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white'
                    }`}
                  >
                    <span>⏳</span> {opType === 'despesa' ? 'A Pagar (Pendente)' : 'A Receber (Pendente)'}
                  </button>
                </div>
              </div>
              
              {/* DEMAIS CAMPOS (DATA, DESCRIÇÃO, CATEGORIA, CONTA, VALOR, RATEIO) */}
              <div>
                <label className="block font-bold text-slate-700 dark:text-slate-300 mb-1 flex items-center justify-between">
                  <span>
                    📅 {opType === 'despesa'
                      ? (status === 'completed' ? 'Data do Pagamento (Quando foi pago)' : 'Data de Vencimento (Quando você vai pagar)')
                      : (status === 'completed' ? 'Data do Recebimento (Quando caiu na conta)' : 'Data Prevista (Quando você vai receber)')
                    }
                  </span>
                  <span className="text-[10px] text-indigo-600 dark:text-indigo-400 font-semibold">
                    {status === 'pending' ? 'Vencimento / Previsão' : 'Data de Efetivação'}
                  </span>
                </label>
                <input
                  type="date"
                  required
                  value={date}
                  onChange={e => setDate(e.target.value)}
                  className="w-full p-2.5 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl outline-none font-mono"
                />
              </div>

              <div>
                <label className="block font-bold text-slate-600 dark:text-slate-400 mb-1">Descrição</label>
                <input
                  required
                  value={description}
                  onChange={e => setDescription(e.target.value)}
                  placeholder="Ex: Supermercado Mensal, iPhone 10x, Salário"
                  className="w-full p-2.5 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl outline-none font-medium"
                />
              </div>

              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className="block font-bold text-slate-600 dark:text-slate-400 mb-1">Categoria</label>
                  <select
                    value={contaDespesa}
                    onChange={e => setContaDespesa(e.target.value)}
                    className="w-full p-2.5 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl outline-none font-medium"
                  >
                    {activeAccounts.filter(a => a.account_type === (opType === 'despesa' ? 'EXPENSE' : 'REVENUE')).map(a => (
                      <option key={a.id} value={a.id}>{a.name}</option>
                    ))}
                  </select>
                </div>
                <div>
                  <label className="block font-bold text-slate-600 dark:text-slate-400 mb-1">Conta Bancária / Cartão</label>
                  <select
                    value={contaOrigem}
                    onChange={e => setContaOrigem(e.target.value)}
                    className="w-full p-2.5 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl outline-none font-medium"
                  >
                    {activeAccounts.filter(a => a.account_type === 'ASSET' || a.account_type === 'LIABILITY').map(a => (
                      <option key={a.id} value={a.id}>{a.name}</option>
                    ))}
                  </select>
                </div>
              </div>

              <div>
                <label className="block font-bold text-slate-600 dark:text-slate-400 mb-1">
                  {isRecurring ? 'Valor por Parcela / Mês (R$)' : 'Valor Total (R$)'}
                </label>
                <input
                  type="number"
                  step="0.01"
                  required
                  value={valor}
                  onChange={e => setValor(e.target.value)}
                  placeholder="0,00"
                  className="w-full p-3 font-mono text-base font-bold bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-xl outline-none text-right"
                />
              </div>

              {/* SELEÇÃO DE RATEIO DE CASAL (APENAS QUANDO HOUVER PARCEIRO NA FAMÍLIA) */}
              {opType === 'despesa' && partnerName && (
                <div className="p-3.5 bg-slate-50 dark:bg-slate-800/80 rounded-2xl border border-slate-200 dark:border-slate-700 space-y-2">
                  <span className="block font-bold text-[11px] text-slate-600 dark:text-slate-300 uppercase tracking-wider">
                    Rateio de Despesa ({ownerName || 'Eu'} & {partnerName})
                  </span>

                  <div className="grid grid-cols-3 gap-1.5 p-1 bg-slate-200 dark:bg-slate-900 rounded-xl">
                    <button
                      type="button"
                      onClick={() => { triggerHaptic('light'); setOwnershipType('owner_only'); }}
                      className={`py-2 px-1 rounded-lg text-xs font-bold transition ${
                        ownershipType === 'owner_only'
                          ? 'bg-white dark:bg-indigo-600 text-slate-900 dark:text-white shadow-sm'
                          : 'text-slate-600 dark:text-slate-400 hover:text-slate-900'
                      }`}
                    >
                      Só Meu ({ownerName || 'Eu'})
                    </button>

                    <button
                      type="button"
                      onClick={() => { triggerHaptic('light'); setOwnershipType('shared_50_50'); }}
                      className={`py-2 px-1 rounded-lg text-xs font-bold transition ${
                        ownershipType === 'shared_50_50'
                          ? 'bg-purple-600 text-white shadow-sm'
                          : 'text-slate-600 dark:text-slate-400 hover:text-slate-900'
                      }`}
                    >
                      Dividido (50%)
                    </button>

                    <button
                      type="button"
                      onClick={() => { triggerHaptic('light'); setOwnershipType('partner_only'); }}
                      className={`py-2 px-1 rounded-lg text-xs font-bold transition ${
                        ownershipType === 'partner_only'
                          ? 'bg-pink-600 text-white shadow-sm'
                          : 'text-slate-600 dark:text-slate-400 hover:text-slate-900'
                      }`}
                    >
                      Só de {partnerName}
                    </button>
                  </div>

                  {ownershipType !== 'owner_only' && (
                    <div className="text-[11px] font-semibold text-purple-700 dark:text-purple-300 pt-1 flex justify-between items-center animate-in fade-in">
                      <span>{partnerName} reembolsará:</span>
                      <span className="font-mono font-bold text-xs">{formatarMoeda(valorDevidoParceiro)}</span>
                    </div>
                  )}
                </div>
              )}

              {/* OPÇÃO DE RECORRÊNCIA E PARCELAMENTO INTEGRADA */}
              {!editingTransacao && (
                <div className="p-3.5 bg-slate-50 dark:bg-slate-800/80 rounded-2xl border border-slate-200 dark:border-slate-700 space-y-3">
                  <div className="flex items-center justify-between">
                    <div className="flex items-center gap-2">
                      <span className="text-indigo-600 dark:text-indigo-400">
                        <RepeatIcon />
                      </span>
                      <div>
                        <span className="font-bold text-slate-900 dark:text-white block text-xs">Tornar Recorrente / Parcelado</span>
                        <span className="text-[11px] text-slate-500">Agendar automaticamente nos próximos meses</span>
                      </div>
                    </div>
                    <input
                      type="checkbox"
                      checked={isRecurring}
                      onChange={e => { triggerHaptic('light'); setIsRecurring(e.target.checked); }}
                      className="w-5 h-5 rounded text-indigo-600 cursor-pointer"
                    />
                  </div>

                  {isRecurring && (
                    <div className="pt-3 border-t border-slate-200 dark:border-slate-700 space-y-3 animate-in fade-in">
                      <div className="grid grid-cols-2 gap-2">
                        <button
                          type="button"
                          onClick={() => setRecDurationMode('meses')}
                          className={`py-2 px-3 rounded-xl font-bold text-xs transition border ${recDurationMode === 'meses' ? 'bg-indigo-600 text-white border-indigo-600 shadow-md' : 'bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-300 border-slate-200 dark:border-slate-700'}`}
                        >
                          📅 Quantidade de Meses
                        </button>
                        <button
                          type="button"
                          onClick={() => setRecDurationMode('continua')}
                          className={`py-2 px-3 rounded-xl font-bold text-xs transition border ${recDurationMode === 'continua' ? 'bg-indigo-600 text-white border-indigo-600 shadow-md' : 'bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-300 border-slate-200 dark:border-slate-700'}`}
                        >
                          ♾️ Contínua (Sem Fim)
                        </button>
                      </div>

                      {recDurationMode === 'meses' && (
                        <div className="space-y-2">
                          <div className="flex justify-between items-center">
                            <label className="text-[11px] font-bold text-slate-600 dark:text-slate-400">Total de Parcelas / Meses</label>
                            <span className="text-xs font-mono font-black text-indigo-600 dark:text-indigo-400">{mesesVal} meses</span>
                          </div>
                          <div className="flex items-center gap-2">
                            <input
                              type="number"
                              min="1"
                              max="120"
                              value={recMonthCount}
                              onChange={e => setRecMonthCount(Math.max(1, parseInt(e.target.value, 10) || 1))}
                              className="w-24 p-2 bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-600 rounded-xl text-center font-mono font-bold text-sm"
                            />
                            <div className="flex gap-1 flex-1 overflow-x-auto py-1">
                              {[2, 3, 6, 10, 12, 18, 24, 36, 48].map(n => (
                                <button
                                  key={n}
                                  type="button"
                                  onClick={() => setRecMonthCount(n)}
                                  className={`px-2 py-1 text-[11px] font-mono font-bold rounded-lg border transition ${mesesVal === n ? 'bg-indigo-100 dark:bg-indigo-950 text-indigo-700 dark:text-indigo-300 border-indigo-400' : 'bg-white dark:bg-slate-800 text-slate-500 border-slate-200 dark:border-slate-700'}`}
                                >
                                  {n}x
                                </button>
                              ))}
                            </div>
                          </div>
                        </div>
                      )}

                      <div className="p-3 bg-indigo-50 dark:bg-indigo-950/40 rounded-xl border border-indigo-200 dark:border-indigo-800/60 space-y-1">
                        <div className="flex justify-between items-center text-xs">
                          <span className="text-slate-600 dark:text-slate-400 font-medium">
                            {recDurationMode === 'meses' ? `Total do Parcelamento (${mesesVal}x):` : 'Projeção Anual:'}
                          </span>
                          <span className="font-mono font-bold text-indigo-700 dark:text-indigo-300 text-sm">
                            {formatarMoeda(recDurationMode === 'meses' ? valorNumerico * mesesVal : valorNumerico * 12)}
                          </span>
                        </div>
                        <span className="text-[10px] text-slate-500 block">
                          {recDurationMode === 'meses'
                            ? `O 1º lançamento será efetivado agora. As outras ${mesesVal - 1} parcelas serão projetadas nos meses seguintes até ${dataTerminoRecorrencia || 'o fim'}.`
                            : 'O primeiro lançamento será salvo agora e os próximos meses serão projetados continuamente.'}
                        </span>
                      </div>
                    </div>
                  )}
                </div>
              )}

              <div className="flex gap-2 pt-2">
                <button type="button" onClick={onClose} className="flex-1 py-3 bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-400 font-bold rounded-2xl tap-target">Cancelar</button>
                <button type="submit" className="flex-1 py-3 bg-indigo-600 hover:bg-indigo-500 text-white font-bold rounded-2xl shadow-lg shadow-indigo-600/30 tap-target">{editingTransacao ? 'Salvar Alterações' : 'Salvar Lançamento'}</button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    // Componente Modal de Reavaliação e Atualização Mensal de Investimentos (Marcação a Mercado)
    function ModalReavaliacaoInvestimento({ initialAccount, valuation, accounts, accountBalances, investmentValuations, ownerName, partnerName, onClose, onSave, formatarMoeda }) {
      const contasInvest = useMemo(() => {
        const list = accounts.filter(a => a.account_type === 'ASSET' && (a.subtype === 'investment' || a.name.toLowerCase().includes('invest') || a.name.toLowerCase().includes('selic') || a.name.toLowerCase().includes('cdb') || a.name.toLowerCase().includes('ações') || a.name.toLowerCase().includes('fii')));
        return list.length > 0 ? list : accounts.filter(a => a.account_type === 'ASSET');
      }, [accounts]);

      const [selectedAccountId, setSelectedAccountId] = useState(valuation?.account_id || initialAccount?.id || (contasInvest[0]?.id || ''));
      const targetAccount = accounts.find(a => a.id === selectedAccountId);

      const [dataMedicao, setDataMedicao] = useState(valuation?.date || new Date().toISOString().split('T')[0]);
      const [valorAnterior, setValorAnterior] = useState(() => {
        if (valuation) return valuation.previous_amount;
        if (initialAccount) return accountBalances[initialAccount.id] || 0;
        if (contasInvest[0]) return accountBalances[contasInvest[0].id] || 0;
        return 0;
      });
      const [novoValor, setNovoValor] = useState(valuation ? String(valuation.new_amount) : '');
      const [titular, setTitular] = useState(valuation?.titular || initialAccount?.titular || 'Ambos');
      const [notes, setNotes] = useState(valuation?.notes || '');
      const [criarLancamentoContabil, setCriarLancamentoContabil] = useState(!valuation);

      useEffect(() => {
        if (!valuation && targetAccount) {
          setValorAnterior(accountBalances[targetAccount.id] || 0);
          setTitular(targetAccount.titular || 'Ambos');
        }
      }, [selectedAccountId, targetAccount, accountBalances, valuation]);

      const valAntesNum = parseFloat(valorAnterior) || 0;
      const valNovoNum = parseFloat(novoValor);
      const diferenca = !isNaN(valNovoNum) ? valNovoNum - valAntesNum : 0;
      const variacaoPct = valAntesNum > 0 && !isNaN(valNovoNum) ? (diferenca / valAntesNum) * 100 : (valNovoNum > 0 ? 100 : 0);

      // Sparkline do Ativo (Progressive Disclosure)
      const sparklineData = useMemo(() => {
        if (!investmentValuations || !selectedAccountId) return [];
        const filtrados = investmentValuations
          .filter(v => v.account_id === selectedAccountId)
          .sort((a, b) => a.date.localeCompare(b.date));

        if (filtrados.length === 0) {
          return [
            { label: 'Atual', amount: valAntesNum },
            { label: 'Novo', amount: !isNaN(valNovoNum) && valNovoNum > 0 ? valNovoNum : valAntesNum }
          ];
        }

        const pts = filtrados.map(v => ({
          label: v.date.split('-').slice(1).join('/'),
          amount: v.new_amount
        }));

        if (!isNaN(valNovoNum) && valNovoNum > 0 && !valuation) {
          pts.push({ label: 'Novo', amount: valNovoNum });
        }

        return pts;
      }, [investmentValuations, selectedAccountId, valAntesNum, valNovoNum, valuation]);

      return (
        <div className="fixed inset-0 bg-slate-950/75 backdrop-blur-sm flex items-center justify-center p-4 z-[99999] animate-in fade-in">
          <div className="bg-white dark:bg-slate-900 rounded-3xl p-6 max-w-md w-full border border-slate-200 dark:border-slate-800 shadow-2xl space-y-4 text-xs max-h-[95vh] overflow-y-auto">
            
            {/* CABEÇALHO */}
            <div className="flex justify-between items-center border-b border-slate-100 dark:border-slate-800 pb-3">
              <div>
                <h3 className="font-extrabold text-base text-slate-900 dark:text-white flex items-center gap-2">
                  <TrendingUpIcon /> {valuation ? 'Editar Reconciliação' : 'Marcação a Mercado'}
                </h3>
                <p className="text-[11px] text-slate-400">Reconciliação e atualização da posição patrimonial</p>
              </div>
              <button onClick={onClose} className="text-slate-400 hover:text-white tap-target">✕</button>
            </div>

            {/* SELEÇÃO DO ATIVO & DATA */}
            <div className="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
              <div>
                <label className="block font-bold text-slate-600 dark:text-slate-400 text-[11px] mb-1">Carteira / Ativo</label>
                <select
                  value={selectedAccountId}
                  onChange={e => setSelectedAccountId(e.target.value)}
                  className="w-full p-2.5 font-semibold bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl outline-none"
                >
                  {contasInvest.map(a => (
                    <option key={a.id} value={a.id}>{a.name} ({a.titular})</option>
                  ))}
                </select>
              </div>

              <div>
                <label className="block font-bold text-slate-600 dark:text-slate-400 text-[11px] mb-1">Data da Medição</label>
                <input
                  type="date"
                  value={dataMedicao}
                  onChange={e => setDataMedicao(e.target.value)}
                  className="w-full p-2.5 font-mono font-semibold bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl outline-none"
                />
              </div>
            </div>

            {/* 1. FOCO ÚNICO: SALDO ATUAL CADASTRADO (TIPOGRAFIA NEUTRA) */}
            <div className="p-3.5 bg-slate-50 dark:bg-slate-800/50 rounded-2xl border border-slate-200/60 dark:border-slate-700/60 text-center space-y-0.5">
              <span className="text-[10px] font-bold text-slate-400 uppercase tracking-wider block">
                Saldo Atual Registrado no Sistema
              </span>
              <span className="text-xl font-extrabold font-mono text-slate-700 dark:text-slate-200">
                {formatarMoeda(valAntesNum)}
              </span>
            </div>

            {/* 2. CENTRO: DIGITAÇÃO FLUIDA DO NOVO SALDO TOTAL */}
            <div className="space-y-2">
              <label className="block text-center font-bold text-xs text-indigo-600 dark:text-indigo-400 uppercase tracking-wider">
                Informe o Novo Saldo Total
              </label>
              
              <div className="relative">
                <input
                  type="number"
                  step="0.01"
                  autoFocus
                  value={novoValor}
                  onChange={e => setNovoValor(e.target.value)}
                  placeholder="0,00"
                  required
                  className="w-full p-3.5 font-mono font-black text-2xl text-center bg-white dark:bg-slate-900 border-2 border-indigo-500 rounded-2xl outline-none shadow-sm focus:ring-4 focus:ring-indigo-500/15 transition text-slate-900 dark:text-white"
                />
              </div>

              {/* ATALHOS / PRESETS RÁPIDOS DE AJUSTE */}
              <div className="flex gap-1.5 justify-center flex-wrap pt-0.5">
                {[
                  { label: '+R$ 100', val: 100 },
                  { label: '+R$ 500', val: 500 },
                  { label: '+R$ 1.000', val: 1000 },
                  { label: '+R$ 5.000', val: 5000 },
                  { label: '+1%', pct: 0.01 },
                  { label: '+2%', pct: 0.02 },
                  { label: '+5%', pct: 0.05 }
                ].map((item, idx) => (
                  <button
                    key={idx}
                    type="button"
                    onClick={() => {
                      triggerHaptic('light');
                      const base = !isNaN(valNovoNum) && valNovoNum > 0 ? valNovoNum : valAntesNum;
                      if (item.val) {
                        setNovoValor((base + item.val).toFixed(2));
                      } else if (item.pct) {
                        setNovoValor((base * (1 + item.pct)).toFixed(2));
                      }
                    }}
                    className="px-2 py-1 bg-slate-100 dark:bg-slate-800 hover:bg-indigo-50 dark:hover:bg-indigo-950 text-slate-600 dark:text-slate-300 hover:text-indigo-600 dark:hover:text-indigo-400 font-mono font-bold text-[10px] rounded-lg border border-slate-200 dark:border-slate-700 transition active:scale-95"
                  >
                    {item.label}
                  </button>
                ))}
              </div>
            </div>

            {/* 3. FEEDBACK EM TEMPO REAL (O DELTA) COM CORES E SINAIS ACESSÍVEIS */}
            {!isNaN(valNovoNum) && novoValor !== '' && (
              <div className={`p-3.5 rounded-2xl border transition-all space-y-1 ${
                diferenca > 0
                  ? 'bg-emerald-50 dark:bg-emerald-950/40 border-emerald-300 dark:border-emerald-800 text-emerald-800 dark:text-emerald-200'
                  : diferenca < 0
                  ? 'bg-rose-50 dark:bg-rose-950/40 border-rose-300 dark:border-rose-800 text-rose-800 dark:text-rose-200'
                  : 'bg-slate-50 dark:bg-slate-800/40 border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-400'
              }`}>
                <div className="flex justify-between items-center">
                  <span className="font-bold text-xs flex items-center gap-1.5">
                    <span>{diferenca > 0 ? '▲' : diferenca < 0 ? '▼' : '⚪'}</span>
                    <span>{diferenca > 0 ? 'Rendimento do Período:' : diferenca < 0 ? 'Variação de Mercado:' : 'Sem Variação:'}</span>
                  </span>
                  <span className="font-mono font-black text-sm">
                    {diferenca > 0 ? '+' : ''}{formatarMoeda(diferenca)} ({variacaoPct > 0 ? '+' : ''}{variacaoPct.toFixed(2)}%)
                  </span>
                </div>

                {diferenca > 0 && (
                  <div className="text-[11px] font-semibold text-emerald-700 dark:text-emerald-300 flex items-center gap-1 pt-0.5">
                    <span>🎉</span>
                    <span>Seu patrimônio cresceu <strong>+{variacaoPct.toFixed(2)}%</strong> neste fechamento!</span>
                  </div>
                )}

                {diferenca < 0 && (
                  <div className="text-[10px] text-rose-600 dark:text-rose-400">
                    Ajuste por oscilação negativa ou resgate pontual.
                  </div>
                )}
              </div>
            )}

            {/* 4. MOTIVO / NOTAS & TITULAR */}
            <div className="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
              <div>
                <label className="block font-bold text-slate-600 dark:text-slate-400 text-[11px] mb-1">Titular da Posição</label>
                <select
                  value={titular}
                  onChange={e => setTitular(e.target.value)}
                  className="w-full p-2.5 font-semibold bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl outline-none"
                >
                  <option value="Ambos">Ambos / Casal</option>
                  <option value={ownerName}>{ownerName}</option>
                  <option value={partnerName}>{partnerName}</option>
                </select>
              </div>

              <div>
                <label className="block font-bold text-slate-600 dark:text-slate-400 text-[11px] mb-1">Motivo / Notas</label>
                <input
                  value={notes}
                  onChange={e => setNotes(e.target.value)}
                  placeholder="Ex: Rendimento do mês, Aporte"
                  className="w-full p-2.5 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl outline-none font-medium"
                />
              </div>
            </div>

            {/* AJUSTE CONTÁBIL AUTOMÁTICO (PARTIDAS DOBRADAS) */}
            <div className="p-2.5 bg-slate-50 dark:bg-slate-800/60 rounded-xl border border-slate-200 dark:border-slate-700">
              <label className="flex items-center gap-2 cursor-pointer">
                <input
                  type="checkbox"
                  checked={criarLancamentoContabil}
                  onChange={e => setCriarLancamentoContabil(e.target.checked)}
                  className="rounded border-slate-300 text-indigo-600 focus:ring-indigo-500"
                />
                <span className="text-[10px] font-semibold text-slate-700 dark:text-slate-300">
                  Gerar lançamento contábil no Diário (Partidas Dobradas) para balancear o Patrimônio Líquido
                </span>
              </label>
            </div>

            {/* 5. BOTÕES DE CONFIRMAÇÃO */}
            <div className="flex gap-2 pt-1">
              <button
                type="button"
                onClick={onClose}
                className="flex-1 py-3 bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-400 font-bold rounded-2xl tap-target text-xs"
              >
                Cancelar
              </button>
              <button
                type="button"
                onClick={() => {
                  if (!selectedAccountId) {
                    alert("Selecione a conta de investimento.");
                    return;
                  }
                  if (isNaN(valNovoNum)) {
                    alert("Informe o novo valor total da posição.");
                    return;
                  }
                  onSave({
                    id: valuation?.id,
                    accountId: selectedAccountId,
                    date: dataMedicao,
                    previousAmount: valAntesNum,
                    newAmount: valNovoNum,
                    notes,
                    titular,
                    criarLancamentoContabil
                  });
                }}
                className="flex-1 py-3 bg-indigo-600 hover:bg-indigo-500 text-white font-bold rounded-2xl shadow-lg shadow-indigo-600/30 tap-target text-xs"
              >
                {valuation ? 'Salvar Alterações' : 'Confirmar Reconciliação'}
              </button>
            </div>

            {/* 6. GRÁFICO DE CONTEXTO: SPARKLINE (PROGRESSIVE DISCLOSURE) */}
            {sparklineData.length > 1 && ResponsiveContainer && AreaChart && Area && (
              <div className="p-3 bg-slate-50/80 dark:bg-slate-800/40 rounded-2xl border border-slate-100 dark:border-slate-800 space-y-1 mt-2">
                <div className="flex justify-between items-center text-[10px] text-slate-400 font-bold uppercase tracking-wider">
                  <span>Evolução Recente Desta Carteira (Sparkline)</span>
                  <span className="font-mono text-indigo-500">{sparklineData.length} pontos</span>
                </div>
                <div className="h-14 w-full">
                  <ResponsiveContainer width="100%" height="100%">
                    <AreaChart data={sparklineData} margin={{ top: 2, right: 2, left: 2, bottom: 2 }}>
                      <defs>
                        <linearGradient id="sparklineGradModal" x1="0" y1="0" x2="0" y2="1">
                          <stop offset="0%" stopColor="#6366f1" stopOpacity={0.4} />
                          <stop offset="100%" stopColor="#6366f1" stopOpacity={0.0} />
                        </linearGradient>
                      </defs>
                      <Area
                        type="monotone"
                        dataKey="amount"
                        stroke="#6366f1"
                        strokeWidth={2.5}
                        fillOpacity={1}
                        fill="url(#sparklineGradModal)"
                        dot={false}
                      />
                    </AreaChart>
                  </ResponsiveContainer>
                </div>
              </div>
            )}

          </div>
        </div>
      );
    }

    // Componente de Definição de Orçamento (Aplicar a Todos os Meses ou Mês Específico)
    function ModalOrcamentoEnvelope({ account, currentAmount, selectedYear, selectedMonth, monthName, isCustom, onClose, onSave, formatarMoeda, triggerHaptic }) {
      const [valor, setValor] = useState(currentAmount !== undefined && currentAmount !== null ? String(currentAmount) : '');
      const [modoAlcance, setModoAlcance] = useState(isCustom ? 'mes' : 'todos'); // 'todos' | 'mes'

      const valorNum = Math.max(0, parseFloat(valor) || 0);

      const isRevenue = account.account_type === 'REVENUE';

      return (
        <div className="fixed inset-0 bg-slate-950/75 backdrop-blur-sm flex items-center justify-center p-4 z-[99999] animate-in fade-in">
          <div className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl p-6 max-w-md w-full shadow-2xl space-y-5 text-xs">
            
            {/* CABEÇALHO */}
            <div className="flex justify-between items-center border-b border-slate-100 dark:border-slate-800 pb-3">
              <div className="flex items-center gap-3">
                <div className="w-10 h-10 rounded-2xl flex items-center justify-center text-white font-bold shrink-0 shadow-md" style={{ backgroundColor: account.color || (isRevenue ? '#10b981' : '#4f46e5') }}>
                  {isRevenue ? <span>💰</span> : <TargetIcon />}
                </div>
                <div>
                  <h3 className="font-extrabold text-base text-slate-900 dark:text-white">
                    {isRevenue ? 'Meta de Receita Estimada' : 'Orçamento da Categoria'}
                  </h3>
                  <span className="text-xs text-slate-400 font-semibold">{account.name} ({isRevenue ? 'Origem de Renda' : 'Despesa'})</span>
                </div>
              </div>
              <button onClick={onClose} className="text-slate-400 hover:text-white tap-target">✕</button>
            </div>

            {/* DIGITAÇÃO DO VALOR */}
            <div className="space-y-2">
              <label className="block text-xs font-bold text-slate-500 uppercase tracking-wider text-center">
                {isRevenue ? 'Meta Mensal de Receita / Renda Esperada (R$)' : 'Meta Mensal de Gastos (R$)'}
              </label>
              
              <div className="relative">
                <input
                  type="number"
                  step="0.01"
                  autoFocus
                  value={valor}
                  onChange={e => setValor(e.target.value)}
                  placeholder="0,00"
                  className={`w-full p-3.5 font-mono font-black text-2xl text-center bg-slate-50 dark:bg-slate-800 border-2 rounded-2xl outline-none shadow-sm text-slate-900 dark:text-white transition ${
                    isRevenue ? 'border-emerald-500/50 focus:border-emerald-500' : 'border-indigo-500/50 focus:border-indigo-500'
                  }`}
                />
              </div>

              {/* ATALHOS / PRESETS RÁPIDOS */}
              <div className="flex gap-1.5 justify-center flex-wrap pt-1">
                {[
                  { label: '+R$ 100', val: 100 },
                  { label: '+R$ 500', val: 500 },
                  { label: '+R$ 1.000', val: 1000 },
                  { label: '+R$ 2.000', val: 2000 },
                  { label: '+R$ 5.000', val: 5000 },
                  { label: 'Zerar', val: 0, setZero: true }

    // Componente de Cronograma Mês a Mês da Recorrência com Edição Individual de Parcelas
    function ModalCronogramaRecorrencia({ pattern, accounts, transactions, postings, ownerName, partnerName, onClose, onSaveSingleMonth, onToggleMonthStatus, formatarMoeda }) {
      const [editingMonth, setEditingMonth] = useState(null); // { index, date, amount, status }
      
      const schedule = useMemo(() => {
        if (!pattern) return [];
        const baseMonths = projectAllRecurrenceMonths(pattern, 36);
        const templateTotal = (pattern.template_postings || []).filter(p => p.amount > 0).reduce((s, p) => s + p.amount, 0);
        const isExpense = (pattern.template_postings || []).some(p => {
          const a = accounts.find(acc => acc.id === p.account_id);
          return a?.account_type === 'EXPENSE';
        });

        return baseMonths.map(m => {
          // Procura transação real correspondente a esta ocorrência/mês
          const trans = transactions.find(t => {
            const samePattern = t.recurrence_id && (t.recurrence_id === pattern.id);
            const sameMonth = t.date && t.date.startsWith(m.ymStr);
            const sameRecDate = t.recurrence_date === m.date;
            return (samePattern && (sameRecDate || sameMonth));
          });

          if (trans) {
            const transPost = postings.filter(p => p.transaction_id === trans.id);
            const debitPosting = transPost.find(p => p.amount > 0);
            const total = debitPosting ? debitPosting.amount : transPost.filter(p => p.amount > 0).reduce((s, p) => s + p.amount, 0);
            const isCustomized = Math.abs(total - templateTotal) > 0.01 || trans.date !== m.date;

            return {
              ...m,
              currentDate: trans.date,
              originalDate: m.date,
              amount: total,
              templateAmount: templateTotal,
              isCustomized,
              status: trans.status || 'completed',
              isEfetivado: trans.status !== 'pending',
              isExpense,
              transactionId: trans.id,
              transaction: trans,
              isVirtual: false
            };
          } else {
            return {
              ...m,
              currentDate: m.date,
              originalDate: m.date,
              amount: templateTotal,
              templateAmount: templateTotal,
              isCustomized: false,
              status: 'pending',
              isEfetivado: false,
              isExpense,
              transactionId: null,
              transaction: null,
              isVirtual: true
            };
          }
        });
      }, [pattern, transactions, postings, accounts]);

      const totalAcumulado = useMemo(() => {
        return schedule.reduce((sum, item) => sum + item.amount, 0);
      }, [schedule]);

      const totalEfetivado = useMemo(() => {
        return schedule.filter(item => item.isEfetivado).reduce((sum, item) => sum + item.amount, 0);
      }, [schedule]);

      const totalPendente = totalAcumulado - totalEfetivado;

      return (
        <div className="fixed inset-0 bg-slate-950/75 backdrop-blur-sm flex items-center justify-center p-4 z-[99999] animate-in fade-in">
          <div className="bg-white dark:bg-slate-900 rounded-3xl p-6 max-w-4xl w-full border border-slate-200 dark:border-slate-800 shadow-2xl space-y-5 text-xs max-h-[90vh] flex flex-col justify-between">
            
            {/* CABEÇALHO */}
            <div className="flex justify-between items-start border-b border-slate-100 dark:border-slate-800 pb-4">
              <div>
                <div className="flex items-center gap-2.5">
                  <span className="p-2.5 rounded-2xl bg-indigo-50 dark:bg-indigo-950 text-indigo-600 dark:text-indigo-400">
                    <RepeatIcon />
                  </span>
                  <div>
                    <h3 className="font-extrabold text-base text-slate-900 dark:text-white flex items-center gap-2">
                      Cronograma Mês a Mês: {pattern.description}
                    </h3>
                    <p className="text-xs text-slate-500">
                      Visão detalhada de todos os meses. Edite o valor, a data ou a situação de qualquer mês individualmente.
                    </p>
                  </div>
                </div>
              </div>
              <button onClick={onClose} className="text-slate-400 hover:text-slate-900 dark:hover:text-white p-2 tap-target text-base">✕</button>
            </div>

            {/* CARDS DE RESUMO DA SÉRIE */}
            <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
              <div className="p-4 bg-slate-50 dark:bg-slate-800/60 rounded-2xl border border-slate-200/80 dark:border-slate-700/80">
                <span className="text-[10px] font-bold text-slate-400 uppercase tracking-wider block mb-1">Total Previsto da Série</span>
                <span className="text-lg font-black font-mono text-slate-900 dark:text-white">{formatarMoeda(totalAcumulado)}</span>
                <span className="text-[10px] text-slate-500 block mt-0.5">{schedule.length} meses projetados</span>
              </div>

              <div className="p-4 bg-emerald-50 dark:bg-emerald-950/40 rounded-2xl border border-emerald-200/80 dark:border-emerald-800/80">
                <span className="text-[10px] font-bold text-emerald-700 dark:text-emerald-300 uppercase tracking-wider block mb-1">Já Realizado / Pago</span>
                <span className="text-lg font-black font-mono text-emerald-600 dark:text-emerald-400">{formatarMoeda(totalEfetivado)}</span>
                <span className="text-[10px] text-emerald-600/70 block mt-0.5">{schedule.filter(i => i.isEfetivado).length} parcelas quitadas</span>
              </div>

              <div className="p-4 bg-amber-50 dark:bg-amber-950/40 rounded-2xl border border-amber-200/80 dark:border-amber-800/80">
                <span className="text-[10px] font-bold text-amber-700 dark:text-amber-300 uppercase tracking-wider block mb-1">Restante a Pagar / Receber</span>
                <span className="text-lg font-black font-mono text-amber-600 dark:text-amber-400">{formatarMoeda(totalPendente)}</span>
                <span className="text-[10px] text-amber-600/70 block mt-0.5">{schedule.filter(i => !i.isEfetivado).length} parcelas pendentes</span>
              </div>
            </div>

            {/* TABELA MÊS A MÊS SCROLLABLE */}
            <div className="flex-1 overflow-y-auto rounded-2xl border border-slate-200 dark:border-slate-800 min-h-[220px]">
              <table className="w-full text-left text-xs">
                <thead className="bg-slate-50 dark:bg-slate-800/80 text-slate-500 font-bold border-b border-slate-200 dark:border-slate-700 sticky top-0 uppercase text-[10px]">
                  <tr>
                    <th className="p-3.5 w-24">Parcela</th>
                    <th className="p-3.5 w-32">Mês / Ano</th>
                    <th className="p-3.5 w-36">Data Vencimento</th>
                    <th className="p-3.5 text-right w-36">Valor do Mês</th>
                    <th className="p-3.5 text-center w-36">Situação</th>
                    <th className="p-3.5 text-center w-48">Ações por Mês</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-slate-100 dark:divide-slate-800 font-sans">
                  {schedule.map((item, idx) => {
                    const isEditingThis = editingMonth && editingMonth.index === item.index;
                    const hojeStr = new Date().toISOString().split('T')[0];
                    const isAtrasado = item.currentDate < hojeStr && !item.isEfetivado;
                    
                    return (
                      <tr key={idx} className={`hover:bg-slate-50/70 dark:hover:bg-slate-800/40 transition ${item.isCustomized ? 'bg-indigo-50/30 dark:bg-indigo-950/20' : ''}`}>
                        
                        {/* PARCELA */}
                        <td className="p-3.5 font-mono font-bold text-slate-500">
                          <span className="px-2 py-1 bg-slate-100 dark:bg-slate-800 rounded-lg text-[11px]">
                            {item.installment}
                          </span>
                        </td>

                        {/* MÊS / ANO */}
                        <td className="p-3.5 font-bold text-slate-900 dark:text-white">
                          {['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho', 'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'][item.month - 1]} / {item.year}
                        </td>

                        {/* DATA */}
                        <td className="p-3.5 font-mono text-slate-700 dark:text-slate-300">
                          {isEditingThis ? (
                            <input
                              type="date"
                              value={editingMonth.date}
                              onChange={e => setEditingMonth({ ...editingMonth, date: e.target.value })}
                              className="p-1.5 bg-white dark:bg-slate-800 border border-indigo-500 rounded-lg font-mono text-xs w-32"
                            />
                          ) : (
                            <div>
                              <span className="font-bold">{item.currentDate}</span>
                              {isAtrasado && <span className="block text-[10px] text-rose-500 font-bold">⚠️ Vencido</span>}
                            </div>
                          )}
                        </td>

                        {/* VALOR */}
                        <td className="p-3.5 text-right font-mono font-bold">
                          {isEditingThis ? (
                            <input
                              type="number"
                              step="0.01"
                              value={editingMonth.amount}
                              onChange={e => setEditingMonth({ ...editingMonth, amount: e.target.value })}
                              className="p-1.5 bg-white dark:bg-slate-800 border border-indigo-500 rounded-lg font-mono text-xs w-28 text-right font-bold"
                            />
                          ) : (
                            <div>
                              <span className={`text-xs ${item.isCustomized ? 'text-indigo-600 dark:text-indigo-400 font-black' : 'text-slate-900 dark:text-white'}`}>
                                {formatarMoeda(item.amount)}
                              </span>
                              {item.isCustomized && (
                                <span className="block text-[9px] text-indigo-500 uppercase font-sans font-bold">
                                  ✏️ Personalizado
                                </span>
                              )}
                            </div>
                          )}
                        </td>

                        {/* SITUAÇÃO */}
                        <td className="p-3.5 text-center">
                          {isEditingThis ? (
                            <select
                              value={editingMonth.status}
                              onChange={e => setEditingMonth({ ...editingMonth, status: e.target.value })}
                              className="p-1.5 bg-white dark:bg-slate-800 border border-indigo-500 rounded-lg text-xs font-bold"
                            >
                              <option value="completed">✅ Pago / Recebido</option>
                              <option value="pending">⏳ Pendente</option>
                            </select>
                          ) : (
                            <button
                              onClick={() => onToggleMonthStatus(pattern, item)}
                              className={`px-2.5 py-1 rounded-xl text-[11px] font-bold transition flex items-center justify-center gap-1 mx-auto ${
                                item.isEfetivado
                                  ? 'bg-emerald-100 dark:bg-emerald-950 text-emerald-700 dark:text-emerald-300 hover:bg-emerald-200'
                                  : 'bg-amber-100 dark:bg-amber-950 text-amber-700 dark:text-amber-300 hover:bg-amber-200'
                              }`}
                              title="Clique para alternar o status deste mês"
                            >
                              <span>{item.isEfetivado ? '✅' : '⏳'}</span>
                              <span>{item.isEfetivado ? (item.isExpense ? 'Pago' : 'Recebido') : 'Pendente'}</span>
                            </button>
                          )}
                        </td>

                        {/* AÇÕES */}
                        <td className="p-3.5 text-center">
                          {isEditingThis ? (
                            <div className="flex items-center justify-center gap-1.5">
                              <button
                                onClick={async () => {
                                  const val = parseFloat(editingMonth.amount);
                                  if (isNaN(val) || val <= 0) {
                                    alert("Informe um valor válido.");
                                    return;
                                  }
                                  await onSaveSingleMonth(pattern, item, editingMonth.date, val, editingMonth.status);
                                  setEditingMonth(null);
                                }}
                                className="px-3 py-1 bg-emerald-600 hover:bg-emerald-500 text-white rounded-lg font-bold text-xs shadow-sm tap-target"
                              >
                                Salvar
                              </button>
                              <button
                                onClick={() => setEditingMonth(null)}
                                className="px-2.5 py-1 bg-slate-200 dark:bg-slate-700 text-slate-700 dark:text-slate-300 rounded-lg text-xs tap-target"
                              >
                                Cancelar
                              </button>
                            </div>
                          ) : (
                            <div className="flex items-center justify-center gap-1.5">
                              <button
                                onClick={() => {
                                  triggerHaptic('light');
                                  setEditingMonth({
                                    index: item.index,
                                    date: item.currentDate,
                                    amount: item.amount,
                                    status: item.status
                                  });
                                }}
                                className="px-2.5 py-1 bg-indigo-50 dark:bg-indigo-950 text-indigo-600 dark:text-indigo-400 hover:bg-indigo-100 rounded-xl font-bold text-[11px] transition flex items-center gap-1 tap-target"
                              >
                                <EditIcon /> Editar
                              </button>

                              <button
                                onClick={() => onToggleMonthStatus(pattern, item)}
                                className={`px-2 py-1 rounded-xl text-[11px] font-bold transition flex items-center gap-1 tap-target ${
                                  item.isEfetivado
                                    ? 'text-slate-400 hover:text-amber-600'
                                    : 'bg-emerald-50 dark:bg-emerald-950 text-emerald-600 hover:bg-emerald-100'
                                }`}
                                title={item.isEfetivado ? 'Reabrir como Pendente' : 'Dar Baixa / Efetivar agora'}
                              >
                                <CheckIcon /> {item.isEfetivado ? 'Reabrir' : 'Efetivar'}
                              </button>
                            </div>
                          )}
                        </td>

                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>

            {/* RODAPÉ */}
            <div className="flex justify-end pt-2 border-t border-slate-100 dark:border-slate-800">
              <button
                onClick={onClose}
                className="px-6 py-2.5 bg-slate-900 dark:bg-slate-100 text-white dark:text-slate-900 font-bold rounded-2xl text-xs hover:bg-slate-800 tap-target"
              >
                Fechar Cronograma
              </button>
            </div>

          </div>
        </div>
      );
    }
